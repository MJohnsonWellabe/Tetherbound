name: Set up Godot verification
description: Restore Godot and project imports, then reject import-time parse/resource errors.
runs:
  using: composite
  steps:
    # The editor binary only (CI-SEGMENTS setup trim, 2026-10-05). Verify jobs
    # never export, and the old shared `godot-<version>` cache also carried
    # the export templates: a 1.27 GB restore per job (run 37246987633) for
    # a ~150 MB binary. The export job keeps its own templates cache.
    - uses: actions/cache@v4
      id: cache-godot
      with:
        path: ~/godot-bin
        key: godot-editor-${{ env.GODOT_VERSION }}
    - shell: bash
      if: steps.cache-godot.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
        mkdir -p ~/godot-bin
        curl -sSL -o /tmp/godot.zip "${base}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
        unzip -q /tmp/godot.zip -d /tmp
        mv "/tmp/Godot_v${GODOT_VERSION}_linux.x86_64" ~/godot-bin/godot
        chmod +x ~/godot-bin/godot
    - shell: bash
      run: echo "$HOME/godot-bin" >> "$GITHUB_PATH"
    # Restored on every run, saved only from main runs (last step below):
    # each import cache is ~2.7 GB, a branch restores main's by prefix and
    # reimports only what it changed, and per-branch copies were evicting the
    # shared assets cache from the repo's 10 GB budget (CI-SPEED, 4 Nov 2026).
    - uses: actions/cache/restore@v4
      id: import-cache
      with:
        path: .godot
        key: import-${{ env.GODOT_VERSION }}-${{ hashFiles('project.godot', '**/*.import') }}
        restore-keys: import-${{ env.GODOT_VERSION }}-
    - shell: bash
      run: godot --headless --path . --import || true
    - shell: bash
      run: |
        set -euo pipefail
        godot --headless --path . --import 2>&1 | tee /tmp/import.log
        if grep -qiE 'SCRIPT ERROR|Parse Error|Failed to load|ERROR: Cannot open' /tmp/import.log; then
          echo '::error::import produced script or resource errors'
          exit 1
        fi
    - if: github.ref == 'refs/heads/main' && steps.import-cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@v4
      with:
        path: .godot
        key: ${{ steps.import-cache.outputs.cache-primary-key }}
