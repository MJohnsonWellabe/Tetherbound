              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "smoke_${SMOKE}.gd failed on attempt ${n}/${RETRIES}"
          done
          exit 1
      # T1-AUDIO. Boots the real world and asserts on what reached the
