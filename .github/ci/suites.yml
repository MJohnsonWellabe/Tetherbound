            !/archive/
      - uses: ./.github/actions/setup-godot
      - name: Verify playground
        if: ${{ !cancelled() }}
        env: { SMOKE: playground, RETRIES: 1 }
        run: |
          set -uo pipefail
          n=0
          until [ "$n" -ge "$RETRIES" ]; do
            n=$((n + 1))
            echo "::group::smoke_${SMOKE}.gd attempt ${n}/${RETRIES}"
            if godot --headless --path . --script "tests/smoke_${SMOKE}.gd"; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "smoke_${SMOKE}.gd failed on attempt ${n}/${RETRIES}"
          done
          exit 1
      - name: Verify input
        if: ${{ !cancelled() }}
        env: { SMOKE: input, RETRIES: 1 }
        run: |
          set -uo pipefail
          n=0
          until [ "$n" -ge "$RETRIES" ]; do
            n=$((n + 1))
            echo "::group::smoke_${SMOKE}.gd attempt ${n}/${RETRIES}"
            if godot --headless --path . --script "tests/smoke_${SMOKE}.gd"; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "smoke_${SMOKE}.gd failed on attempt ${n}/${RETRIES}"
          done
          exit 1
      - name: Verify unstick
        if: ${{ !cancelled() }}
        env: { SMOKE: unstick, RETRIES: 1 }
        run: |
          set -uo pipefail
          n=0
          until [ "$n" -ge "$RETRIES" ]; do
            n=$((n + 1))
            echo "::group::smoke_${SMOKE}.gd attempt ${n}/${RETRIES}"
            if godot --headless --path . --script "tests/smoke_${SMOKE}.gd"; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "smoke_${SMOKE}.gd failed on attempt ${n}/${RETRIES}"
          done
          exit 1
      - name: Verify traversal
        if: ${{ !cancelled() }}
        env: { SMOKE: traversal, RETRIES: 3 }
        run: |
          set -uo pipefail
          n=0
          until [ "$n" -ge "$RETRIES" ]; do
            n=$((n + 1))
            echo "::group::smoke_${SMOKE}.gd attempt ${n}/${RETRIES}"
            if godot --headless --path . --script "tests/smoke_${SMOKE}.gd"; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "smoke_${SMOKE}.gd failed on attempt ${n}/${RETRIES}"
          done
          exit 1
      - name: Verify audio
        if: ${{ !cancelled() }}
        env: { SMOKE: audio, RETRIES: 2 }
        run: |
          set -uo pipefail
          n=0
          until [ "$n" -ge "$RETRIES" ]; do
            n=$((n + 1))
            echo "::group::smoke_${SMOKE}.gd attempt ${n}/${RETRIES}"
            if godot --headless --path . --script "tests/smoke_${SMOKE}.gd"; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "smoke_${SMOKE}.gd failed on attempt ${n}/${RETRIES}"
          done
          exit 1
      # T5-CARE. Cheap (no world build -- it stands up a two-node stand-in
      # scene, which is all `tab_backpack.gd::_player_node()` reads) and it
      # guards a defect that shipped under a green suite: berries carry both
      # `satiety` and `creature_food`, `_read_use()` tests `creature_food`
      # first, and berries are the only item in the game with a satiety
      # value -- so the player could not eat from the Satchel at all while
      # `test_food.gd` passed, because that file calls `eat()` directly.
      # This one presses the buttons instead. No retries: it touches no
      # spawning, no pathing and no fight, so a failure here is real.
      - name: Verify backpack_player_eats
        if: ${{ !cancelled() }}
