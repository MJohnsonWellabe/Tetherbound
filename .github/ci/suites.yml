# PACKED SOLO SUITES (CI-SEGMENTS phase C, 2026-10-05).
#
# Each entry below was a ci.yml job and is kept VERBATIM: its `if:` (the
# affected-only selection), matrix, timeouts and steps are unchanged, and
# `runs-on`/`needs` are no longer read. The `verify-packed` job in ci.yml runs
# them through tools/ci/packed.py: every matrix value is one suite instance,
# every `!cancelled()` step one unit, units planned longest-first over the
# measured step times (tools/ci/packed_durations.json) onto 8 runners x 2
# lanes. Each unit gets its own user:// (XDG_*), TMPDIR and RUNNER_TEMP. Every
# step keeps its own verdict: a failure is an ::error:: naming the suite, the
# step and the lane.
#
# Edit a suite here exactly as you would have edited its job. A new step needs
# no plan change (it is planned at UNMEASURED_SECONDS until measured). Only
# `run:` steps can be packed; a suite that uploads an artifact, runs network
# peers or needs its own setup stays a job in ci.yml. tests/test_ci_packed.py
# checks this file.
suites:
  # test_veg_corridor.gd, alone, in its own job with its own ceiling.
  #
  # It costs ~10 minutes by itself: measured 10m11s on ralph/WORLD-GRASS (6
  # tests, 1,341,749 assertions, 0 failed), against verify-unit-tests' 12-minute
  # timeout which also has to cover checkout, the Godot cache and two import
  # passes (~1m50s of that budget in run 2461). That is why shard 2 was killed
  # twice in a row at ~12.3 minutes on that branch, in a run whose other twelve
  # jobs were green -- and a timeout kill reports as CANCELLED, not failed,
  # which is what makes it read like infrastructure noise instead of a budget.
  #
  # WHY NOT A SEVENTH SHARD. verify-unit-tests' own note says to look for a real
  # per-test cost problem before reaching for one, and this is that problem:
  # once a single FILE exceeds the ceiling, sharding cannot help, because it
  # distributes files and cannot split one. A seventh shard would only move
  # which shard dies.
  #
  # WHY NOT RAISE THE CEILING. That file has been raised once (10 -> 12) and
  # split three times (2 -> 4 -> 5 -> 6), and its own note is explicit: "if this
  # starts clipping again, the fix is splitting run_tests.gd into two jobs, not
  # raising this further." This is that split, applied to the file that actually
  # costs the time, so the other ~40 test files keep a tight 12-minute ceiling
  # that still catches a real runaway.
  #
  # WHY NOT MAKE THE FILE CHEAPER. Its two whole-config RULES.all_placements()
  # calls are genuine regression checks over every layer against the real
  # corridor. The 2026-08-25 pass that shrank the other layer-reading tests
  # deliberately left these two alone -- see that file's own comments -- because
  # shrinking them would cut coverage rather than waste. Nothing here changes
  # what runs; only where.
  #
  # 25 minutes, not 12: ~10 minutes today with roughly 2.5x headroom, because
  # this file's cost scales with vegetation density and the grass work has
  # already moved it once (the bake went 466,922 -> 725,949 placements).
  verify-veg-corridor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    if: needs.changes.outputs.full == 'true' && (contains(needs.changes.outputs.jobs, '|ALL|') || contains(needs.changes.outputs.jobs, '|verify-veg-corridor|'))

    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch commits and trees but no blobs, then materialise only the
          # paths a verification job actually reads. `changes` already proved
          # blob:none works here. The four excluded trees are 1.20 GB of the
          # 2.08 GB tracked tip and no job reads any of them: this file's own
          # no-build filter below already classes ralph/ and docs/ as paths
          # that do not trigger a build, shots/ and ralph/reports are capture
          # OUTPUT, and assets_raw/ is listed in .gitignore as material that
          # should never have been committed. Measured: 2.1 GB -> 895 MB of
          # working tree, importing clean and passing smoke + unit shard.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/ralph/
            !/docs/
            !/shots/
            !/assets_raw/
            !/archive/
      - uses: ./.github/actions/setup-godot
      - name: Run the corridor vegetation regression checks
        run: |
          godot --headless --path . --script tests/run_tests.gd \
            -- --only=test_veg_corridor.gd

  # test_scatter_rules.gd, alone, for the same reason test_veg_corridor.gd is.
  #
  # MEASURED 2026-08-26 on ralph/WORLD-GRASS's tree (725,949 placements), timing
  # every file in its shard individually: test_scatter_rules.gd is 850s of the
  # shard's 858s. The other ten files are one second each. That is not a
  # distribution problem and no shard count fixes it.
  #
  # It is why verify-unit-tests shard 2 was timeout-killed on that branch at both
  # SIX shards (10m49s) and TEN (10m50s) -- the ten-shard change moved nothing,
  # because this file lands in shard 2 either way and carries the whole cost.
  # A timeout kill reports as CANCELLED, not failed, which is what made it read
  # as infrastructure noise three separate times.
  #
  # The cost is real coverage, not waste: ci.yml's own note above records this
  # file as one of the RULES.all_placements() callers, which walks every
  # vegetation layer against the real corridor. Its runtime therefore TRACKS
  # VEGETATION DENSITY, exactly like verify-veg-corridor's -- so re-time it
  # before landing any further density increase.
  #
  # 30 minutes: ~14 minutes measured locally at today's densest bake, with
  # roughly 2x headroom for the next one.
  verify-scatter-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - changes
      - queue-after-longest
    if: needs.changes.outputs.full == 'true' && (contains(needs.changes.outputs.jobs, '|ALL|') || contains(needs.changes.outputs.jobs, '|verify-scatter-rules|'))

    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch commits and trees but no blobs, then materialise only the
          # paths a verification job actually reads. `changes` already proved
          # blob:none works here. The four excluded trees are 1.20 GB of the
          # 2.08 GB tracked tip and no job reads any of them: this file's own
          # no-build filter below already classes ralph/ and docs/ as paths
          # that do not trigger a build, shots/ and ralph/reports are capture
          # OUTPUT, and assets_raw/ is listed in .gitignore as material that
          # should never have been committed. Measured: 2.1 GB -> 895 MB of
          # working tree, importing clean and passing smoke + unit shard.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/ralph/
            !/docs/
            !/shots/
            !/assets_raw/
            !/archive/
      - uses: ./.github/actions/setup-godot
      - name: Run the scatter rules regression checks
        run: |
          godot --headless --path . --script tests/run_tests.gd \
            -- --only=test_scatter_rules.gd

  # THIRD file to outgrow the shards, same cause as the other two: its cost
  # tracks vegetation density, not test count.
  #
  # Measured 2026-08-26 against the 762,058-placement bake: test_harvest.gd is
  # 22 tests but **684,231 assertions** -- against 977,745 for the whole rest of
  # the suite. Locally it takes ~10 minutes on its own.
  #
  # It killed verify-unit-tests shard 10 twice on ralph/LAND-ALL-2 (run 2528,
  # both attempts), and the shape is worth recognising because the shard log
  # does not say "slow": the last line is a passing `test_marking_*` test and
  # then nothing until `The operation was canceled`, which reads like a hang.
  #
  # Deliberately NOT a raised ceiling and NOT more shards. The ceiling was
  # already raised twice and this file's own note forbids a third. More shards
  # cannot help either: the marking tests are one indivisible file, and every
  # extra shard pays the same ~8 minutes of checkout and import before it runs
  # anything -- on that run, 8 of the 12 minutes were overhead.
  verify-harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - changes
      - queue-after-longest
    if: needs.changes.outputs.full == 'true' && (contains(needs.changes.outputs.jobs, '|ALL|') || contains(needs.changes.outputs.jobs, '|verify-harvest|'))

    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch commits and trees but no blobs, then materialise only the
          # paths a verification job actually reads. `changes` already proved
          # blob:none works here. The four excluded trees are 1.20 GB of the
          # 2.08 GB tracked tip and no job reads any of them: this file's own
          # no-build filter below already classes ralph/ and docs/ as paths
          # that do not trigger a build, shots/ and ralph/reports are capture
          # OUTPUT, and assets_raw/ is listed in .gitignore as material that
          # should never have been committed. Measured: 2.1 GB -> 895 MB of
          # working tree, importing clean and passing smoke + unit shard.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/ralph/
            !/docs/
            !/shots/
            !/assets_raw/
            !/archive/
      - uses: ./.github/actions/setup-godot
      # F27 (batch 532): Altar spend and catch-overflow release payout, solo/host
      # real paths. smoke_f27_wild_defeat_essence joins after the actor_vitals flip.
      - name: Verify f27_altar_spend
        if: ${{ !cancelled() }}
        env: { SMOKE: f27_altar_spend, RETRIES: 1 }
        run: |
          set -uo pipefail
          n=0
          until [ "$n" -ge "$RETRIES" ]; do
            n=$((n + 1))
            echo "::group::smoke_${SMOKE}.gd attempt ${n}/${RETRIES}"
            if godot --headless --path . --script "tests/smoke_${SMOKE}.gd"; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "smoke_${SMOKE}.gd failed on attempt ${n}/${RETRIES}"
          done
          exit 1
      - name: Verify release
        if: ${{ !cancelled() }}
        env: { SMOKE: release, RETRIES: 1 }
        run: |
          set -uo pipefail
          n=0
          until [ "$n" -ge "$RETRIES" ]; do
            n=$((n + 1))
            echo "::group::smoke_${SMOKE}.gd attempt ${n}/${RETRIES}"
            if godot --headless --path . --script "tests/smoke_${SMOKE}.gd"; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "smoke_${SMOKE}.gd failed on attempt ${n}/${RETRIES}"
          done
          exit 1
      - name: Run the harvest regression checks
        run: |
          godot --headless --path . --script tests/run_tests.gd \
            -- --only=test_harvest.gd

  # BELOW: six jobs that used to each be a `strategy: matrix` fanning one job
  # PER SMOKE TEST (43 jobs total across the six). Same tests, same retry
  # counts below, now as sequential STEPS in one job per group instead -- one
  # checkout and one Godot setup per group instead of one per test. See this
  # file's header for the measured queueing problem this addresses. Every step
  # after the first carries `if: ${{ !cancelled() }}` so one test failing does
  # not skip the rest -- the job's own conclusion is still `failure` if any
  # step failed, same as `fail-fast: false` gave the old matrix.
  verify-core-verb-shard:
    runs-on: ubuntu-latest
    # Sum of the original seven tests' own run time measured 2026-09-01:
    # 1,392s (23.2 min), including a flaky-retry run of smoke_traversal.gd
    # that spent all 3 attempts. ~35 min leaves real margin above that for
    # checkout/setup plus a worse retry day; smoke_catch_aim_slowdown.gd
    # added 2026-09-02 is short (one fight, two ~1s measurement windows) and
    # fits comfortably in that margin.
    timeout-minutes: 35
    needs:
      - changes
      - queue-after-longest
    if: needs.changes.outputs.full == 'true' && (contains(needs.changes.outputs.jobs, '|ALL|') || contains(needs.changes.outputs.jobs, '|verify-core-verb-shard|'))
    steps:
      - uses: actions/checkout@v4
