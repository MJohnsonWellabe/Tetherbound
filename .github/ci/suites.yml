    # (24.6 min), the longest of the six consolidated groups -- it is now
    # this workflow's long pole in exchange for 7 fewer jobs than the other
    # five groups combined would need at one-test-per-job. 35 min covers
    # checkout/setup margin. The opening segment runs once: a first failure
    # must remain visible rather than being rescued by a second fresh opening.
    #
    # A ninth step, trainer_no_usable_ally, was added south-bridge-fainted-
    # party (2026-09-01) alongside the eight above. The file existed on
    # `main` already (archive/reports/FINDING-T2-STRANDING-2026-08-30.md's own regression
    # proof) but was never wired into any CI job, so it never actually ran
    # after the day it was written. Its own world stand-up is the same
    # 300-frame boot smoke_trainer_battle.gd pays in verify-combat-shard
    # (measured there at well under a minute of the group's own budget), so
    # 40 min keeps the same retry headroom this job already had without
    # a fresh full-suite measurement to attribute an exact number to this
    # step alone.
    # CI-SEGMENTS (owner 2026-10-04): the bracket and the finale are separate
    # processes (396 s + 238 s, run 37246987633) and now run on their own legs.
    # The bracket itself is a continuous chain cut at its natural save point:
    # bracket-to-semi plays the closed/train/sign-up branches, the lost and
    # retried quarter-final, the quarter- and semi-final, then saves through
    # Game.save_game and checks that save against checkpoint
    # bracket/after_semi (contract + committed digest; stale -> the regen
    # command). bracket-final loads that committed checkpoint through
    # Game.load_game, asserts the same contract, and plays the final and the
    # champion beats. verify-segment-handoffs (chain: bracket) proves the
    # handoff; verify-unbroken-chains runs the whole bracket in one process on
    # the scheduled tier. The final segment shares its runner with the finale
    # (~5 + ~6 min, run 37256861064): under the account's ~20-job cap a third
    # runner only adds ~2 min of setup.
    strategy:
      fail-fast: false
      matrix:
        group: [bracket-to-semi, bracket-final]
    timeout-minutes: 40
    needs:
      - changes
      - queue-after-long
    if: needs.changes.outputs.full == 'true' && (contains(needs.changes.outputs.jobs, '|ALL|') || contains(needs.changes.outputs.jobs, '|verify-gate-evidence-finale|'))
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch commits and trees but no blobs, then materialise only the
          # paths a verification job actually reads. `changes` already proved
          # blob:none works here. The four excluded trees are 1.20 GB of the
          # 2.08 GB tracked tip and no job reads any of them: this file's own
          # no-build filter below already classes ralph/ and docs/ as paths
          # that do not trigger a build, shots/ and ralph/reports are capture
          # OUTPUT, and assets_raw/ is listed in .gitignore as material that
          # should never have been committed. Measured: 2.1 GB -> 895 MB of
          # working tree, importing clean and passing smoke + unit shard.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/ralph/
            !/docs/
            !/shots/
            !/assets_raw/
            !/archive/
      - uses: ./.github/actions/setup-godot
      - name: Verify tournament_bracket segment ${{ matrix.group }}
        if: ${{ startsWith(matrix.group, 'bracket-') && (!cancelled()) }}
        run: |
          set -euo pipefail
          segment="${{ matrix.group }}"
          home="${RUNNER_TEMP}/bracket-home"; out="${RUNNER_TEMP}/bracket-out"
          mkdir -p "$home" "$out"
          XDG_DATA_HOME="$home" TB_SEGMENT_OUT="$out" \
            godot --headless --path . --script tests/smoke_tournament_bracket.gd -- --segment="${segment#bracket-}"
      # GATE-E. The chapter's FINALE, walked continuously in one boot with a
      # full five: in from the entrance, the three gauntlet fights, the
      # recovery point, the elite, the shutter, the reveal, the Warden, the
      # lever, the release ceremony a full belt forces, the region's response,
      # and the post-victory acknowledgment that ends the objective chain.
      # smoke_stronghold.gd proves the route and fights nobody; smoke_boss.gd
      # starts at the Warden with a level-1 starter. The seams between them
      # were covered by nothing, and driving them end to end found three real
      # defects on main.
      - name: Verify gate_e_finale
        if: ${{ matrix.group == 'bracket-final' && (!cancelled()) }}
        env: { SMOKE: gate_e_finale, RETRIES: 1 }
        run: |
          set -uo pipefail
          n=0
          until [ "$n" -ge "$RETRIES" ]; do
            n=$((n + 1))
            echo "::group::smoke_${SMOKE}.gd attempt ${n}/${RETRIES}"
            if godot --headless --path . --script "tests/smoke_${SMOKE}.gd"; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "smoke_${SMOKE}.gd failed on attempt ${n}/${RETRIES}"
          done
          exit 1

  # CI-TRUTH-0903. `tests/smoke_gate_b_continuous.gd` used to run in NO CI job
  # at all -- not even a known-red one -- which is exactly how two of
  # `gate_b_tail_segment.gd`'s own assertions sat failing against label
  # strings that had never existed in `data/progression/objectives.json`:
