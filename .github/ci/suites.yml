      - uses: ./.github/actions/setup-godot
      # RETRIES: 2, not 1. `archive/docs/CURRENT_STATE.md` §3 already tracks a real,
      # open P1 here: the tutorial catch's clear-shot-to-target search is
      # unstable across KO/re-engage rounds inside this same opening drive
      # (verified locally 2026-09-03 -- one of two runs on an unrelated commit
      # failed with "could not find a spot with a clear line to the
      # Bramblebun 9 times running", the other passed clean). That is the
      # opening's own bug to fix, not this job's to hide -- but a single
      # attempt would make this job flake on a beat nobody touched, which is
