  #
  # The file's default (no flag) run now stops after tournament readiness --
  # the opening, the road gate, the village visit for tools and tournament
  # readiness are the beats that have actually passed reliably. This is
  # THAT part, gating: a regression in any of the four is caught the same
  # push it lands on, same as every other required job. The gather route and
