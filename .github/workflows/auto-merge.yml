name: Auto merge settled work

# This trusted base workflow only arms auto merge for branches in this repo.
# Branch protection waits for traceability and ci-gate on the PR head.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  enable-auto-merge:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge automatically after required checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr merge --repo "$REPO" --auto --merge "$PR_NUMBER"

  # A merge that this workflow's GITHUB_TOKEN auto-merge performs starts no
  # push run on main (batch 67, 3dbec66b, reached main with no CI). GitHub's
  # schedule for publish-watch's ci-reconcile fires only every few hours, so
  # wait here for the merge and dispatch fast CI on main when no push run
  # appeared. workflow_dispatch from GITHUB_TOKEN does start a run.
  post-merge-ci:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 50
    concurrency:
      group: post-merge-ci-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Wait for the merge, then make sure main CI runs on it
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          sha=""
          for _ in $(seq 1 90); do
            state=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '[.state, (.merged|tostring), (.merge_commit_sha // "")] | join(" ")' || echo "")
            case "$state" in
              "closed true "*) sha=${state##* }; break ;;
              "closed false"*) echo "Closed without merging."; exit 0 ;;
            esac
            sleep 30
          done
          if [ -z "$sha" ]; then
            echo "Not merged within the wait; publish-watch ci-reconcile covers it later."
            exit 0
          fi
          sleep 90
          count=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$sha&per_page=30" \
            --jq '[.workflow_runs[] | select(.event != "pull_request" and .conclusion != "cancelled" and .conclusion != "skipped")] | length')
          if [ "$count" != "0" ]; then
            echo "CI already runs on merge $sha"
            exit 0
          fi
          gh workflow run ci.yml --repo "$REPO" --ref main -f tier=fast
          echo "Dispatched fast CI on main for merge $sha"
