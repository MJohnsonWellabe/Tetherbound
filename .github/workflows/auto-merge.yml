name: Auto merge settled work

# This trusted base workflow only arms auto merge for branches in this repo.
# Branch protection waits for traceability and ci-gate on the PR head.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

jobs:
  enable-auto-merge:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge automatically after required checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        # ci.yml skips every engine job on a PR without `full-ci`, and ci-gate
        # then passes. #548 (2026-10-06) merged untested that way when its
        # label landed after `opened`. Arm only when the engine jobs will run,
        # or when nothing outside docs/evidence changed.
        run: |
          set -euo pipefail
          labels=$(gh api "repos/$REPO/issues/$PR_NUMBER/labels" --jq '[.[].name] | join(",")')
          if [[ ",$labels," != *",full-ci,"* ]]; then
            # Fail closed: a gh api error stops this step instead of reading
            # as "no code changed". Renames count both their old and new path.
            files=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" \
              --jq '.[] | .filename, (.previous_filename // empty)')
            code=$(printf '%s\n' "$files" | grep -vE '^(docs/|ralph/)|\.md$' || true)
            if [ -n "$code" ]; then
              echo "Not arming auto-merge: code changed without the full-ci label:"
              printf '%s\n' "$code" | head -20 | sed 's/^/  /'
              # Disarm one armed earlier, while the PR was docs-only.
              gh pr merge --repo "$REPO" --disable-auto "$PR_NUMBER" || true
              exit 0
            fi
          fi
          gh pr merge --repo "$REPO" --auto --merge "$PR_NUMBER"

  # No post-merge waiter here: a job that slept up to 45 min per PR for the
  # merge held a runner each, so with many open PRs the waiters starved the
  # CI runs the merges were waiting on (10-10: 5 of ~6 running jobs were
  # waiters, 0 CI runs). publish-watch's ci-reconcile dispatches CI on any
  # main merge that has none.
