  # one, on purpose. The wedge it reports ("player got wedged ... move_back at
  # (53, -65)") reproduced on run 2413, went away on runs 2415/2415-rerun and
  # a local run of the identical tree, then came BACK on run 2417 and again on
  # 2419 -- where it failed BOTH the original attempt and its one retry, the
  # same coordinates each time. `tools/_probe_wedge_53_neg65.gd` measured what
  # is actually there: a ~10-15deg slope with `Rock_Medium_1.gltf` 1.39m away
  # -- the identical shape `tools/_probe_wedge.gd` already documented for a
  # DIFFERENT wedge at (-43,-53) in an earlier session ("the player pins
  # against a rock on a slope rather than sliding off it... the defect is in
  # how the body slides, and it is bake-independent"). That is a real,
  # pre-existing defect in the player's own slide/unwedge code, not something
  # this session's changes caused or should rewrite blind -- CLAUDE.md asks
  # that changes to traversal philosophy be flagged, not invented under a CI
  # deadline. What IS this session's to fix is that it now measurably fails
  # more than once in a row under load, which one retry does not cover; a
  # second buys margin without hiding a wedge that fails three attempts
  # straight, which would be the real-bug signal worth trusting.
  #
  # A test that reports something the game plainly does on every retry is a
  # real bug, not a flake -- see ralph/HANDOVER_CONSOLIDATION_2026-08-25.md's
  # own "six defects, one shape" section for that distinction and why it
  # matters not to paper over the other kind.
  verify-core-verb-shard:
    runs-on: ubuntu-latest
    # 22 -> 40. The retry chain above and the old timeout were in direct
    # conflict: this job runs four smokes, and conventions.md measures
    # smoke_traversal.gd alone at ~6 minutes, so its three attempts are ~18 of
    # the 22 minutes before smoke_playground, smoke_input and smoke_catching's
    # two attempts run at all. The job therefore only survived while no retry
    # was needed -- which is exactly the case the third retry was added for.
    #
    # Observed twice on 2026-08-25: run 2432 killed mid-smoke_traversal at
    # 22m50s while still emitting progress, and run 2440 cancelled at ~21m on
    # ralph/WORLD-GRASS, taking three unit shards down with it through matrix
    # fail-fast and blocking a branch whose own tests had passed.
    #
    # This does NOT weaken a test: no retry count changes, no assertion moves.
    # It gives the existing workload a budget it fits in. The cost is that a
    # genuinely wedged traversal now takes 40 minutes to report instead of 22,
    # which is the right trade against red runs that are unrelated to the code
    # under test -- the failure mode that gets real defects dismissed as
    # infrastructure noise.
    timeout-minutes: 40
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
      - name: Verify movement, traversal, and catching
        run: |
          set -euo pipefail
          godot --headless --path . --script tests/smoke_playground.gd
          godot --headless --path . --script tests/smoke_input.gd
          godot --headless --path . --script tests/smoke_traversal.gd || godot --headless --path . --script tests/smoke_traversal.gd || godot --headless --path . --script tests/smoke_traversal.gd
          godot --headless --path . --script tests/smoke_catching.gd || godot --headless --path . --script tests/smoke_catching.gd

  verify-gate-a-ui-build-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
      - name: Verify Gate A build and controller UI paths
        run: |
          set -euo pipefail
          godot --headless --path . --script tests/smoke_free_build.gd
          godot --headless --path . --script tests/smoke_opening.gd || godot --headless --path . --script tests/smoke_opening.gd
          godot --headless --path . --script tests/smoke_starter_picker.gd
          godot --headless --path . --script tests/smoke_modal_stacking.gd
          godot --headless --path . --script tests/smoke_menu.gd
          godot --headless --path . --script tests/smoke_settings.gd

  verify-combat-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
      - name: Verify combat and encounter paths
        run: |
          set -euo pipefail
          godot --headless --path . --script tests/smoke_combat.gd || godot --headless --path . --script tests/smoke_combat.gd
          godot --headless --path . --script tests/smoke_riding.gd || godot --headless --path . --script tests/smoke_riding.gd
          godot --headless --path . --script tests/smoke_boss.gd || godot --headless --path . --script tests/smoke_boss.gd
          godot --headless --path . --script tests/smoke_trainer_battle.gd || godot --headless --path . --script tests/smoke_trainer_battle.gd
          godot --headless --path . --script tests/smoke_aggression.gd || godot --headless --path . --script tests/smoke_aggression.gd

  verify-regions-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
      - name: Verify regional progression paths
        run: |
          set -euo pipefail
          godot --headless --path . --script tests/smoke_warrens.gd
          godot --headless --path . --script tests/smoke_relay_station.gd
          godot --headless --path . --script tests/smoke_relay.gd
          godot --headless --path . --script tests/smoke_stronghold.gd
          # STREAM-D. Not picked up by verify-unit-tests: run_tests.gd globs
          # test_*.gd only, and this one has to be a standalone SceneTree
          # script because _tick_streaming() reads Node3D.global_position,
          # whose getter requires is_inside_tree() -- unreachable from inside
          # run_tests.gd's synchronous _init(). Named here so it is actually
          # run by something; a test nobody runs is not a test, and this one
          # guards the distance activation that the chapter's ~700-1100
          # authored creatures depend on to stay inside frame budget.
          godot --headless --path . --script tests/smoke_wild_streaming.gd
          # GATE-D. smoke_art.gd was in NO ci job at all. ralph/conventions.md
          # tells every agent to run it by hand for creature and model work,
          # and it had been failing on main for long enough that agents learned
          # to expect its failures and ignore them -- which is how ten broken
          # layer assertions survived. Naming it here means it fails a check
          # instead of a habit.
          godot --headless --path . --script tests/smoke_art.gd

  # THE GAP THIS CLOSES. The four shards above preserve "every smoke test from
  # the former one-test-per-runner layout" -- but that layout never covered
  # every smoke test. 46 of the 64 files in tests/ were named by no job at all,
  # and the set that fell through is precisely the set written to prove the
  # owner's own 2026-08-21 ROG playtest bugs fixed: the Load Game stall, the
  # party count after catches, the Satchel/hotbar leak, the Build shortcut's
  # controller ownership, the first trainer battle's camera, arena containment
  # in the Warrens and the Stronghold, and both Gate A/B evidence runs.
  #
  # That is how integration-ABC shipped green with NINE harnesses either failing
  # or asserting the pre-CONTROLLER-MAP pad map. Nothing was wrong with the
  # game; nothing was asking. A regression nobody runs is a comment.
  #
  # Split across two runners rather than one so neither approaches the 22-minute
  # ceiling: the two continuous evidence runs (the opening segment and the
  # tournament bracket) are minutes each on their own.
  verify-owner-regressions-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
      - name: Verify the 2026-08-21 owner playtest regressions
        run: |
          set -euo pipefail
          godot --headless --path . --script tests/smoke_title_load_game.gd
          godot --headless --path . --script tests/smoke_party_count_after_catches.gd
          godot --headless --path . --script tests/smoke_satchel_owns_hotbar.gd
          godot --headless --path . --script tests/smoke_build_owns_creature_cycle.gd
          godot --headless --path . --script tests/smoke_trainer_battle_camera.gd
          godot --headless --path . --script tests/smoke_arena_contain.gd
          godot --headless --path . --script tests/smoke_menu_open_does_not_offer_to_drop.gd

  verify-gate-evidence-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
      - name: Verify the Gate A and Gate B continuous evidence runs
        run: |
          set -euo pipefail
          godot --headless --path . --script tests/smoke_gate_a_opening_segment.gd || godot --headless --path . --script tests/smoke_gate_a_opening_segment.gd
          godot --headless --path . --script tests/smoke_gate_a_build_house.gd
          godot --headless --path . --script tests/smoke_gate_a_rest_torch.gd
          godot --headless --path . --script tests/smoke_post_modal_control.gd
          godot --headless --path . --script tests/smoke_tournament_bracket.gd
          # GATE-E. The chapter's FINALE, walked continuously in one boot with a
          # full five: in from the entrance, the three gauntlet fights, the
          # recovery point, the elite, the shutter, the reveal, the Warden, the
          # lever, the release ceremony a full belt forces, the region's
          # response, and the post-victory acknowledgment that ends the
          # objective chain. smoke_stronghold.gd proves the route and fights
          # nobody; smoke_boss.gd starts at the Warden with a level-1 starter.
          # The seams between them were covered by nothing, and driving them
          # end to end found three real defects on main (the level-up
          # announcement aborting mid-string, the recovery point unable to
          # accept a creature, and `creature_bed_built` set on frame one of a
          # new save by the stronghold's own authored bed).
          godot --headless --path . --script tests/smoke_gate_e_finale.gd

  # The continuous-core evidence path, run so it cannot go dark again.
  #
  # `--gate-a-continuous-core` gates the village/material/paid-build segments
  # inside smoke_gate_a_opening_segment.gd, and NO shard has ever passed that
  # flag. Two worktree runs at integration-ABC (a22534ff) on 2026-08-23 proved
  # the path has been unreachable since that merge: the harness there dies at
  # boot on `combat_throw`, and the current harness on that gameplay dies at the
  # tutorial catch on an empty satchel. So these segments have never executed in
  # CI or locally, while ralph/DONE.md described the path as working.
  #
  # `continue-on-error` is deliberate and TEMPORARY. It is currently RED --
  # "physical interact on the node did not start the visible axe swing
  # (arbiter winner=Interactable, equipped=, prop=<null>)" -- and a red required
  # job would wedge every branch behind a path nobody has ever seen pass. A job
  # that runs and reports red is strictly better than a flag nothing passes:
  # the failure is visible on every run instead of invisible forever.
  #
  # **Remove `continue-on-error` the moment CONTINUOUS-CORE is fixed.** An
  # ignored red job that becomes permanent scenery is the same disease as a
  # green badge that tested nothing.
  verify-continuous-core-known-red:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    if: needs.changes.outputs.code == 'true'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
      - name: Verify the village, material and paid-build continuation (KNOWN RED)
        run: |
          set -euo pipefail
          godot --headless --path . --script tests/smoke_gate_a_opening_segment.gd -- --gate-a-continuous-core

  # Main only. Ralph dispatches CI after a clean branch rebase; treating that
  # workflow_dispatch as an export request made every rebase pay this tail.
  # The export tail was ~40% of every branch
  # run, and it duplicates work: Release re-exports main itself before
  # publishing, so a broken export can never reach the download link through
  # a branch — it would surface on main's own run, where fixing red main is
  # the loop's standing first priority. Split into its own job (rather than
  # trailing steps in a verify job) so it starts only once EVERY verify-*
  # job has actually passed — `needs:` on all of them waits for every one.
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - changes
      - verify-unit-tests
      - verify-veg-corridor
      - verify-core-verb-shard
      - verify-gate-a-ui-build-shard
      - verify-combat-shard
      - verify-regions-shard
      - verify-owner-regressions-shard
      - verify-gate-evidence-shard
    if: |
      needs.changes.outputs.code == 'true' &&
      github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot editor and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          mkdir -p ~/godot-bin
          curl -sSL -o /tmp/godot.zip "${BASE}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp
          mv "/tmp/Godot_v${GODOT_VERSION}_linux.x86_64" ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

          curl -sSL -o /tmp/templates.tpz "${BASE}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp
          TEMPLATE_DIR=~/.local/share/godot/export_templates/${GODOT_VERSION/-/.}
          mkdir -p "$(dirname "$TEMPLATE_DIR")"
          mv /tmp/templates "$TEMPLATE_DIR"

      - name: Add Godot to PATH
        run: echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      - name: Cache the import artifacts
        uses: actions/cache@v4
        with:
          path: .godot
          key: import-${{ env.GODOT_VERSION }}-${{ hashFiles('project.godot', '**/*.import') }}
          restore-keys: import-${{ env.GODOT_VERSION }}-

      - name: Import project (cold)
        run: godot --headless --path . --import || true

      - name: Import project (verify)
        run: godot --headless --path . --import

      - name: Export Windows build
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-debug "Windows Desktop" build/windows/Tetherbound.exe

      - name: Verify the export is a real Windows binary
        # An export can "succeed" and leave a stub behind. Check the file is
        # actually a PE executable and is not implausibly small.
        run: |
          set -euo pipefail
          file build/windows/Tetherbound.exe
          file build/windows/Tetherbound.exe | grep -q "PE32+ executable"
          SIZE=$(stat -c%s build/windows/Tetherbound.exe)
          echo "exe size: ${SIZE} bytes"
          test "$SIZE" -gt 10000000

      - name: Verify the exported build runs and has ground under the player
        # Exports for Linux and RUNS it. Every other test in this file runs the
        # project from source, where res:// is a real directory and addons load
        # from the project tree — so none of them can see an export-only fault.
        # A build shipped with no terrain in it and all of them were green.
        run: |
          sudo apt-get install -y -qq xvfb >/dev/null
          tools/verify_export.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Tetherbound-windows-debug
          path: build/windows/
          retention-days: 14
