          unzip -q /tmp/templates.tpz -d /tmp
          TEMPLATE_DIR=~/.local/share/godot/export_templates/${GODOT_VERSION/-/.}
          mkdir -p "$(dirname "$TEMPLATE_DIR")"
          mv /tmp/templates "$TEMPLATE_DIR"

      - name: Add Godot to PATH
        run: echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      - name: Cache the import artifacts
        uses: actions/cache@v4
        with:
          path: .godot
          key: import-${{ env.GODOT_VERSION }}-${{ hashFiles('project.godot', '**/*.import') }}
          restore-keys: import-${{ env.GODOT_VERSION }}-

      - name: Import project (cold)
        run: godot --headless --path . --import || true

      - name: Import project (verify)
        # The authoritative import check, in one pass rather than two — see
        # verify-unit-tests' copy of this step for the full reasoning.
        run: |
          set -euo pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/import.log
          if grep -qiE "SCRIPT ERROR|Parse Error|Failed to load|ERROR: Cannot open" /tmp/import.log; then
            echo "::error::import produced script or resource errors"
            exit 1
          fi

      - name: Smoke-test the playground
        # Boots the real main scene and asserts the terrain loaded, the player
        # was placed on it, and it is standing on collision. Unit tests cannot
        # see any of that. An earlier version of this check passed while NO
        # terrain was loaded at all, because it read a property that returned
        # null and skipped its own assertion; it now range-checks instead, and
        # is verified to fail when the baked terrain is removed.
        run: godot --headless --path . --script tests/smoke_playground.gd

  verify-input:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.code == 'true'

    steps:
      - uses: actions/checkout@v4

