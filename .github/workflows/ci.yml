  # test_veg_corridor.gd, alone, in its own job with its own ceiling.
  #
  # It costs ~10 minutes by itself: measured 10m11s on ralph/WORLD-GRASS (6
  # tests, 1,341,749 assertions, 0 failed), against verify-unit-tests' 12-minute
  # timeout which also has to cover checkout, the Godot cache and two import
  # passes (~1m50s of that budget in run 2461). That is why shard 2 was killed
  # twice in a row at ~12.3 minutes on that branch, in a run whose other twelve
  # jobs were green -- and a timeout kill reports as CANCELLED, not failed,
  # which is what makes it read like infrastructure noise instead of a budget.
  #
  # WHY NOT A SEVENTH SHARD. verify-unit-tests' own note says to look for a real
  # per-test cost problem before reaching for one, and this is that problem:
  # once a single FILE exceeds the ceiling, sharding cannot help, because it
  # distributes files and cannot split one. A seventh shard would only move
  # which shard dies.
  #
  # WHY NOT RAISE THE CEILING. That file has been raised once (10 -> 12) and
  # split three times (2 -> 4 -> 5 -> 6), and its own note is explicit: "if this
  # starts clipping again, the fix is splitting run_tests.gd into two jobs, not
  # raising this further." This is that split, applied to the file that actually
  # costs the time, so the other ~40 test files keep a tight 12-minute ceiling
  # that still catches a real runaway.
  #
  # WHY NOT MAKE THE FILE CHEAPER. Its two whole-config RULES.all_placements()
  # calls are genuine regression checks over every layer against the real
  # corridor. The 2026-08-25 pass that shrank the other layer-reading tests
  # deliberately left these two alone -- see that file's own comments -- because
  # shrinking them would cut coverage rather than waste. Nothing here changes
  # what runs; only where.
  #
  # 25 minutes, not 12: ~10 minutes today with roughly 2.5x headroom, because
  # this file's cost scales with vegetation density and the grass work has
  # already moved it once (the bake went 466,922 -> 725,949 placements).
  verify-veg-corridor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    # CI-SPEED (owner, 2026-10-07): NIGHTLY ONLY -- vegetation placement data regression; runs on the 8-hourly schedule and on dispatch, not on a full-ci PR.
    if: needs.changes.outputs.full == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (contains(needs.changes.outputs.jobs, '|ALL|') || contains(needs.changes.outputs.jobs, '|verify-veg-corridor|'))

    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch commits and trees but no blobs, then materialise only the
          # paths a verification job actually reads. `changes` already proved
          # blob:none works here. The four excluded trees are 1.20 GB of the
          # 2.08 GB tracked tip and no job reads any of them: this file's own
          # no-build filter below already classes ralph/ and docs/ as paths
          # that do not trigger a build, shots/ and ralph/reports are capture
          # OUTPUT, and assets_raw/ is listed in .gitignore as material that
          # should never have been committed. Measured: 2.1 GB -> 895 MB of
          # working tree, importing clean and passing smoke + unit shard.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/ralph/
            !/docs/
            !/shots/
            !/assets_raw/
            !/archive/
      - uses: ./.github/actions/setup-godot
      - name: Run the corridor vegetation regression checks
        run: |
          godot --headless --path . --script tests/run_tests.gd \
            -- --only=test_veg_corridor.gd

  # test_scatter_rules.gd, alone, for the same reason test_veg_corridor.gd is.
  #
  # MEASURED 2026-08-26 on ralph/WORLD-GRASS's tree (725,949 placements), timing
  # every file in its shard individually: test_scatter_rules.gd is 850s of the
  # shard's 858s. The other ten files are one second each. That is not a
  # distribution problem and no shard count fixes it.
  #
  # It is why verify-unit-tests shard 2 was timeout-killed on that branch at both
  # SIX shards (10m49s) and TEN (10m50s) -- the ten-shard change moved nothing,
  # because this file lands in shard 2 either way and carries the whole cost.
  # A timeout kill reports as CANCELLED, not failed, which is what made it read
  # as infrastructure noise three separate times.
  #
  # The cost is real coverage, not waste: ci.yml's own note above records this
  # file as one of the RULES.all_placements() callers, which walks every
  # vegetation layer against the real corridor. Its runtime therefore TRACKS
  # VEGETATION DENSITY, exactly like verify-veg-corridor's -- so re-time it
