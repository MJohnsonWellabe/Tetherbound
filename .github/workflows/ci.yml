name: CI

# Three checks, in the order they catch things:
#
#   1. the project imports from a clean checkout with no script errors
#   2. the tests pass
#   3. the Windows executable actually exports
#
# The point is that a broken project fails here rather than when the owner next
# opens the editor or, worse, at the end of a milestone when the export is
# tried for the first time. Export templates are a 1.2 GB download, which is
# why they are cached.
#
# What this CANNOT check: whether the game feels good. That is the owner
# playing it on the Ally, and no amount of green here substitutes.

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

env:
  # Pinned deliberately. See docs/decisions/D01-godot-version-and-renderer.md.
  # Export templates must match the editor exactly or the export fails with a
  # message that does not obviously say "version mismatch".
  GODOT_VERSION: 4.7-stable

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot editor and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          mkdir -p ~/godot-bin
          curl -sSL -o /tmp/godot.zip "${BASE}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp
          mv "/tmp/Godot_v${GODOT_VERSION}_linux.x86_64" ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

          curl -sSL -o /tmp/templates.tpz "${BASE}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp
          # Godot looks for the directory named after the version as it reports
          # it: "4.7.stable", not "4.7-stable".
          TEMPLATE_DIR=~/.local/share/godot/export_templates/${GODOT_VERSION/-/.}
          mkdir -p "$(dirname "$TEMPLATE_DIR")"
          mv /tmp/templates "$TEMPLATE_DIR"

      - name: Add Godot to PATH
        run: echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      - name: Import project (cold)
        # The FIRST import on a clean checkout exits non-zero. Terrain3D's
        # GDExtension registers its classes during that cold scan and Godot
        # aborts on shutdown afterwards, AFTER the import work has completed.
        # Verified: the abort happens with the terrain data removed entirely,
        # and the second pass is clean and instant, so the cache it wrote is
        # good. Tolerated here rather than hidden — the pass below is the one
        # that has to be green.
        run: godot --headless --path . --import || true

      - name: Import project (verify)
        # This is the authoritative import check. Non-zero here is a real
        # failure: a script that no longer parses, a scene referencing a
        # missing resource, a malformed project.godot.
        run: godot --headless --path . --import

      - name: Fail on script or scene errors
        run: |
          set -euo pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/import.log
          if grep -qiE "SCRIPT ERROR|Parse Error|Failed to load|ERROR: Cannot open" /tmp/import.log; then
            echo "::error::import produced script or resource errors"
            exit 1
          fi

      - name: Run tests
        run: godot --headless --path . --script tests/run_tests.gd

      - name: Smoke-test the playground
        # Boots the real main scene and asserts the terrain loaded, the player
        # was placed on it, and it is standing on collision. Unit tests cannot
        # see any of that. An earlier version of this check passed while NO
        # terrain was loaded at all, because it read a property that returned
        # null and skipped its own assertion; it now range-checks instead, and
        # is verified to fail when the baked terrain is removed.
        run: godot --headless --path . --script tests/smoke_playground.gd

      - name: Smoke-test the input path
        # Injects actions and asserts the character actually moves. Catches the
        # class of bug where input is read correctly and then silently
        # discarded — a null camera rig makes every direction resolve to zero
        # with no error anywhere. It cannot test the DEVICE layer; if hardware
        # does nothing while this passes, the fault is upstream of Godot.
        run: godot --headless --path . --script tests/smoke_input.gd

      - name: Smoke-test traversal
        # Walks ~190m per leg. A short walk proves only that the spawn point
        # works: collision_mode silently reverting to Dynamic/Game built ground
        # in a 64m bubble, and every other check passed inside it while the
        # player fell to y=-49950 outside it.
        run: godot --headless --path . --script tests/smoke_traversal.gd

      - name: Smoke-test combat
        # Walks up to a wild pal, engages, and PILOTS the fight to a win through
        # injected input (docs/decisions/D07). Asserts the things unit tests
        # cannot see: the pal actually moves on the stick, the arena boundary
        # holds it in without ending the fight, a swing at empty air is reported
        # as a miss, a swing at the opponent connects and earns energy, the
        # opponent closes and telegraphs and leaves an opening, and control and
        # camera come back afterwards.
        #
        # The bug this exists for: the deployed pal became a CharacterBody3D and
        # spent every run standing invisibly inside the trainer, so the two
        # bodies shoved each other and launched the player off the playground at
        # 500 m/s. Every unit test still passed.
        run: godot --headless --path . --script tests/smoke_combat.gd

      - name: Smoke-test catching
        # Aims, misses, and lands a throw through injected input. Asserts the
        # things the catch maths cannot see: aiming hands the camera to the
        # trainer and abandons the pal, the orb is a projectile that can go
        # wide, an orb is spent on a throw and not on a cancel, and a faint is a
        # refusal rather than long odds.
        run: godot --headless --path . --script tests/smoke_catching.gd

      - name: Smoke-test aggression
        # Two halves, and the second matters more: an aggressive pal must start
        # a fight on its own, and a peaceful one must never do so no matter how
        # long the trainer stands next to it. GAME_DESIGN.md §14 allows the
        # first and forbids the second, and one word in species.json is the only
        # thing between them.
        run: godot --headless --path . --script tests/smoke_aggression.gd

      - name: Export Windows build
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-debug "Windows Desktop" build/windows/Tetherbound.exe

      - name: Verify the export is a real Windows binary
        # An export can "succeed" and leave a stub behind. Check the file is
        # actually a PE executable and is not implausibly small.
        run: |
          set -euo pipefail
          file build/windows/Tetherbound.exe
          file build/windows/Tetherbound.exe | grep -q "PE32+ executable"
          SIZE=$(stat -c%s build/windows/Tetherbound.exe)
          echo "exe size: ${SIZE} bytes"
          test "$SIZE" -gt 10000000

      - uses: actions/upload-artifact@v4
        with:
          name: Tetherbound-windows-debug
          path: build/windows/
          retention-days: 14
