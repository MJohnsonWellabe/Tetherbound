          if grep -qiE "SCRIPT ERROR|Parse Error|Failed to load|ERROR: Cannot open" /tmp/import.log; then
            echo "::error::import produced script or resource errors"
            exit 1
          fi

      - name: Smoke-test the input path
        # Injects actions and asserts the character actually moves. Catches the
        # class of bug where input is read correctly and then silently
        # discarded — a null camera rig makes every direction resolve to zero
        # with no error anywhere. It cannot test the DEVICE layer; if hardware
        # does nothing while this passes, the fault is upstream of Godot.
        run: godot --headless --path . --script tests/smoke_input.gd

  verify-traversal:
    runs-on: ubuntu-latest
    # Generous on purpose: this is the single slowest check in the whole
    # pipeline (~5m59s measured 2026-08-15) and the one most worth NOT
    # timing out on a slow runner.
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.code == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot editor and export templates
