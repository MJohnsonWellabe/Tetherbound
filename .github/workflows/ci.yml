name: CI

# Three checks, in the order they catch things:
#
#   1. the project imports from a clean checkout with no script errors
#   2. the tests pass
#   3. the Windows executable actually exports
#
# The point is that a broken project fails here rather than when the owner next
# opens the editor or, worse, at the end of a milestone when the export is
# tried for the first time. Export templates are a 1.2 GB download, which is
# why they are cached.
#
# What this CANNOT check: whether the game feels good. That is the owner
# playing it on the Ally, and no amount of green here substitutes.
#
# JOB COUNT REWORK, 2026-09-01 (owner directive: "having one hour CIs is
# unacceptable... we're just not sitting through that long of testing").
#
# MEASURED, not guessed, on real `ralph/**` runs the same day (run 33451229763,
# 59 jobs, GitHub API job timestamps): every job's own "run" duration (queued
# time excluded) was short -- sum of all 57 executed jobs' run time was only
# 10,187s (~170 runner-minutes), average 173s/job. The run still took 45m46s
# wall clock. The gap is queueing: average queue wait per job was 1,044s
# (17.4 minutes), worst case 2,089s (34.8 minutes) for a single job that then
# ran in 69 seconds. This project runs a fleet of many concurrent `ralph/**`
# lanes, each push spawning its own ~58-job matrix, and GitHub's account-wide
# concurrent-runner limit means those jobs queue behind every other lane's
# jobs -- so a design built to bound wall-clock at "checkout once + the
# slowest single check" instead produces up to 58 separate tickets in the
# same queue, competing with every other lane's 58 tickets. Fixing any one
# job's own runtime does not touch this; only fewer jobs per push does,
# because job COUNT is what is actually scarce.
#
# So the six jobs below that used to fan a `strategy: matrix` out into one
# job PER SMOKE TEST (43 separate jobs across the six) now run their smoke
# tests as sequential STEPS inside one job each -- one checkout, one Godot
# setup, same tests, same retry counts, same pass/fail per test (a failing
# step does not skip the rest; see each job's `if: ${{ !cancelled() }}`).
# `verify-unit-tests` drops from 10 shards to 4: the three files that ever
# threatened a shard's 12-minute ceiling (test_veg_corridor.gd,
# test_scatter_rules.gd, test_harvest.gd) already have their own dedicated
# jobs below and are excluded from this shard's file list, so the shard's
# real remaining cost -- measured the same run at ~108s/shard average across
# 10 shards, 1,084s total -- has never needed 10-way splitting since that
# carve-out landed. Four shards keeps real parallelism with ~2.5x headroom
# under the ceiling instead of manufacturing job count the queue has to pay
# for.
#
# BEFORE / AFTER (2026-09-01 measurement, run 33451229763's job list):
#   Job count on a `ralph/**` push:        57 executed jobs -> 15
#   Sum of per-job "run" time (real work): 10,187s          -> ~10,000s (unchanged --
#     same tests, same assertions; consolidation moves WHERE checkout/setup
#     cost lands, not how much test execution happens)
#   Longest single job (wall, sequential): ~514s (one smoke leg) -> ~1,478s
#     (verify-gate-evidence-shard's 8 tests summed) -- the expected trade:
#     fewer tickets in the queue, a longer critical path once a job actually
#     starts. Still comfortably inside each job's own timeout-minutes below.
#   Observed queue wait that this run actually paid: up to 2,089s (34.8 min)
#     per job, average 1,044s -- the thing 42 fewer jobs per push is aimed at.
#     Exact post-fix queue time cannot be measured until this fix is itself
#     live across the fleet (queueing is a function of every lane's job count,
#     not just this branch's), but a ~74% cut in this workflow's own job
#     count is a ~74% cut in what it asks the shared runner pool for per push.
#
# No coverage was removed: every smoke test, every retry count, and the same
# unit-test file set still run on every push. What changed is which of them
# share a checkout.

# CI-SPEED, 2026-10-07 (owner: a full-ci PR run must finish, ci-gate
# included, in under 30 minutes from push, queue time counted). Measured on
# PR #571 run 37615388024: 64 jobs, 514 runner-minutes, 31.7 min, most of it
# queueing for the account's ~20 runners. Now 13 jobs (~250 runner-minutes)
# after `changes`: 8 net shards, 4 two-lane `verify-suite` jobs
# (tools/ci/run_suite.py, groups in tools/ci/suites/) and export, each about
# 20 minutes, so they all start at once. Owner-authorized trims run on the
# 8-hourly schedule and on workflow_dispatch instead of on a PR: see each
# `NIGHTLY ONLY` note below, `### nightly` steps in tools/ci/suites/ and
# NIGHTLY_ONLY in tools/ci/net_shards.py.

on:
  push:
    # `ralph/**` dropped 2026-09-05 (owner: "the Ralph process isn't even
    # running anymore so just get rid of that"), for the same reason `claude/**`
    # went on 2026-09-03 and with the same effect: a branch that also has a pull
    # request fired BOTH events on every push and ran the whole ~58-job matrix
    # twice on one commit, doubling the queue everything else waits in. The
    # `concurrency` group below cannot dedupe those two, because it keys on
    # `github.ref` and the same commit arrives as `refs/heads/<branch>` from the
    # push and `refs/pull/<n>/merge` from the pull request.
    #
    # Why it was here: Ralph's lane sessions could not open a pull request, so
    # pushing was their only signal, and `ralph-merge.yml` only lands a branch
    # whose CI went green -- without the trigger that workflow waited on a
    # success that could never arrive. That fleet is no longer running, and work
    # now lands through pull requests, whose `pull_request` event below already
    # runs CI exactly once.
    #
    # If a Ralph-style loop is ever restarted, restore `'ralph/**'` here AND
    # give the concurrency group a key both events share (the head SHA), or the
    # double-run comes back for any lane branch that also opens a PR.
    branches: [main]
  pull_request:
    # `labeled` so adding `full-ci` to an open PR starts the full tier at once
    # (the default types would wait for the next push).
    types: [opened, synchronize, reopened, labeled, ready_for_review]
  workflow_dispatch:
    inputs:
      tier:
        # `fast` is what publish-watch.yml dispatches when a merge pushed by
        # GITHUB_TOKEN auto-merge started no CI run on main (see there).
        description: CI tier (full, or fast for a missed main push)
        required: false
        type: choice
        options: [full, fast]
        default: full
  # TWO TIERS, 2026-09-26 (owner: "pare it down and run a full run every 8
  # hours instead of every hour"). Every pull request and main push runs the
  # FAST tier only: parse/import, bake freshness, the unit-test shards and the
  # Windows export (~10 min, 6 jobs, ~30 runner-minutes). The FULL tier --
  # every smoke shard, the net smokes, the gate evidence and the known-red
  # probes (~325 runner-minutes, ~25 min wall) -- runs on this schedule against
  # main, on any manual dispatch, and on a pull request labelled `full-ci`
  # (use it for net/harness/save/authority changes that need it before merge).
  # A red scheduled run is the coordinator's first job: bisect the batches
  # merged since the last green full run and hand the fix to the owning lane.
  schedule:
    - cron: "23 */8 * * *"

# A newer push to the same branch supersedes the run in flight — except on
# main, where every run is kept: Release publishes from main and a cancelled
# verification there would mean shipping on a run nobody finished.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Pinned deliberately. See archive/docs/decisions/D01-godot-version-and-renderer.md.
  # Export templates must match the editor exactly or the export fails with a
  # message that does not obviously say "version mismatch".
  GODOT_VERSION: 4.7-stable

jobs:
  # Roughly half of this workflow's runs change nothing but markdown: the loop
  # pushes a `<task-id>-record` branch after every task, carrying edits to
  # BACKLOG.md, DONE.md and BLOCKED.md and nothing else. Each one used to spend
  # a full build exporting a Windows executable to verify a changed bullet.
  #
  # The obvious fix -- `paths-ignore: ['**.md']` on the push trigger -- is a
  # trap, and an expensive one. For push events a non-matching path filter means
  # GitHub creates NO workflow run at all. No run means no `workflow_run` event,
  # and ralph-merge.yml triggers on exactly that, so a doc-only branch would
  # never merge, never be deleted, and could not be deleted from a Ralph session
  # either (the git proxy refuses `push --delete`). It would strand precisely
  # the branches the loop depends on, and leave nothing red to notice it by.
  #
  # So the run must still happen. This job is what makes it happen: it always
  # runs, so the run always has an executed job and always concludes `success`,
  # which is the only thing ralph-merge.yml reads. Every `verify-*` job below
  # then skips itself when there is nothing to verify. Skipped jobs do not
  # change a run's conclusion -- but a run where EVERY job skipped concludes
  # `skipped`, not `success`, and would be refused. Keep this job unconditional.
  changes:
    runs-on: ubuntu-latest
    # NO PRE-MERGE CI (owner, 2026-09-26: "stop doing CI before merging
    # anything to main"). Pull requests run no build/test jobs: lanes verify
    # locally or with render.yml, the coordinator's independent review gates
    # each `tb/integration-N` batch, and the fast tier runs once on the push
    # to main after merge (plus the 8-hourly full tier); red on main is fixed
    # forward in the next batch. Label a PR `full-ci` to run CI on it anyway.
    # With `changes` skipped every verify job skips, but ci-gate still runs
    # (`if: always()`), so the required check concludes `success` (the "keep
    # unconditional" concern above is met; ralph-merge.yml is an unused
    # legacy helper).
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    # Was 5, which this job's own checkout outgrew. A `timeout-minutes` kill
    # reports as CANCELLED, not failed, and every downstream job then skips --
    # so the run looks like a tidy no-op rather than a job that died. Raised as
    # a safety net only; `filter: blob:none` below is the actual fix.
    timeout-minutes: 15
    # actions: read lets a main push find the last commit CI ran on (below).
    permissions:
      contents: read
      actions: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      # Whether the multiplayer group must run (see `net` in the filter step).
      net: ${{ steps.filter.outputs.net }}
      # The FULL tier (see `on:`): scheduled runs, manual dispatches and PRs
      # labelled `full-ci`. Everything else runs the fast tier.
      full: ${{ steps.tier.outputs.full }}
      # AFFECTED-ONLY SELECTION (owner-approved 2026-10-04): the full-tier
      # verify jobs a change can reach as `|a|b|`, or `|ALL|...` for every job
      # (each gate: `contains(jobs, '|ALL|') || contains(jobs, '|<job>|')`). Rules and
      # their reasons: tools/ci/select_jobs.py (tested by
      # tests/test_ci_select_jobs.py). Conservative: anything the rules cannot
      # bound selects every job; schedule, dispatch, an empty diff or a missing
      # base select every job; every suite still runs on the 8-hourly tier.
      jobs: ${{ steps.filter.outputs.jobs }}
      # CI-SPEED: the verify-suite matrix -- the suites that hold a group this
      # tier and selection run (tools/ci/run_suite.py --list), as a JSON list.
      suites: ${{ steps.suites.outputs.suites }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed to diff against a base that may be many commits back.
          fetch-depth: 0
          # BLOBLESS. This job runs `git diff --name-only` and `git merge-base`
          # plus the small release-helper checks below. The diff operations
          # want commits and trees. Without this, `fetch-depth: 0` downloads every version of
          # every file in the branch's whole ancestry, and this repo's ancestry
          # is roughly 300 baked scatter binaries per bake.
          #
          # It went from a 45-second checkout on 2026-08-26's run 2515 to over
          # five minutes on run 2520, whose branch consolidated five lanes that
          # each carried their own full bake -- about eleven thousand large
          # blobs fetched to look at a list of filenames. Consolidating lanes is
          # still the right call for CI cost, but it multiplies exactly this,
          # so the filter is what keeps it affordable.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /tests/test_release_latest_tag.mjs
            /tools/release_latest_tag.mjs
            /tests/test_ci_smoke_runner.py
            /tools/ci/run_godot_smoke.py
            /tests/test_ci_select_jobs.py
            /tools/ci/select_jobs.py
            # The text the selection's reference scan reads (tools/ci/select_jobs.py
            # SCAN_ROOTS; no media or binary bakes). Must stay in step with it:
            # select_jobs.py selects everything if a REQUIRED_SCAN sentinel is
            # missing, and tests/test_ci_select_jobs.py runs against this tree.
            /project.godot
            /scripts/
            /scenes/
            /autoload/
            /shaders/
            /data/**/*.json
            /data/**/*.tres
            /data/**/*.cfg
            /assets/**/*.tscn
            /assets/**/*.tres
            /tests/*.gd
            /tests/*.py
            /tests/*.sh
            /tests/helpers/
            /tests/fixtures/**/*.gd
            /tools/

      - name: Verify rolling release reference helper
        run: node --test tests/test_release_latest_tag.mjs

      - name: Verify aborted script process cleanup
        run: python3 tests/test_ci_smoke_runner.py

      - name: Verify affected-only job selection rules
        run: python3 tests/test_ci_select_jobs.py

      - name: Verify the net-shard plan (exact one-time cover, budget, matrix)
        run: python3 tests/test_ci_net_shards.py

      - name: Verify the suite plan (exact one-time cover, matrix, tiers)
        run: python3 tests/test_ci_suites.py

      - name: Decide whether anything but documentation changed
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail

          # An explicit manual run requests real code verification even when
          # the branch only carries reference art or documentation.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            echo "Explicit full verification requested."
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "net=true" >> "$GITHUB_OUTPUT"
            sel="$(python3 tools/ci/select_jobs.py --all --event "$GITHUB_EVENT_NAME")" || exit 1
            printf '%s\n' "$sel" | grep '^jobs=|ALL|' >> "$GITHUB_OUTPUT" || exit 1
            exit 0
          fi

          # No-build paths: markdown anywhere, and the four trees the game
          # binary never loads -- the website (published by Release, not
          # compiled), docs/ (reference images feed the visual-judge skill,
          # not the build), ralph/ (the loop's bookkeeping), and .claude/
          # (skills). A .json under data/ or a workflow file can reach the
          # export, so those still get the full build. Screenshot refreshes
          # were costing a full build per JPEG before site/ was here.
          #
          # BASE CHOICE, corrected 2026-09-02. Diffing a branch push against
          # `github.event.before` (the branch's previous push) is how a
          # branch that pushed code, then pushed a report, got every verify
          # job SKIPPED on the second push and a 75-second `success` --
          # three times in one day, with the code never executed. A branch
          # is verified against what it would land on `main`, so for any
          # push that is not to `main` itself the base is the merge-base
          # with `origin/main`.
          #
          # Pushes to `main`, corrected 2026-09-28: the base is the newest
          # main commit that already has a CI run, not `before`. A merge made
          # by GITHUB_TOKEN auto-merge starts no push run at all, so batch 67
          # (3dbec66b) got none; the next merge was board-only, diffed against
          # `before` = 3dbec66b, skipped every job and reported success with
          # batch 67's code never executed. Chaining each main run to the last
          # one that ran means code anywhere in between still builds.
          # A cancelled run built nothing (a newer queued run on main replaces a
          # pending one), so it is not a base.
          # `before` stays the fallback when the run list is unreadable.
          base=""
          if [ -n "${BASE_SHA:-}" ]; then
            base="$BASE_SHA"
          elif [ "${GITHUB_REF_NAME:-}" != "main" ]; then
            git fetch --no-tags --depth=0 origin main 2>/dev/null || true
            base="$(git merge-base origin/main HEAD 2>/dev/null || true)"
          elif last="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&per_page=30" \
                  --jq "[.workflow_runs[] | select(.id != $RUN_ID and .event != \"pull_request\" and .head_sha != \"$GITHUB_SHA\" and .conclusion != \"cancelled\" and .conclusion != \"skipped\")][0].head_sha // empty" 2>/dev/null)" \
               && [ -n "$last" ] \
               && git merge-base --is-ancestor "$last" HEAD 2>/dev/null; then
            echo "Last main commit with a CI run: $last"
            base="$last"
          elif [ -n "${BEFORE:-}" ] \
               && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            # A branch's first push has no usable `before`.
            git fetch --no-tags --depth=0 origin main 2>/dev/null || true
            base="$(git merge-base origin/main HEAD 2>/dev/null || true)"
          fi

          if [ -z "$base" ]; then
            echo "No usable base commit; building."
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "net=true" >> "$GITHUB_OUTPUT"
            sel="$(python3 tools/ci/select_jobs.py --all --event "$GITHUB_EVENT_NAME")" || exit 1
            printf '%s\n' "$sel" | grep '^jobs=|ALL|' >> "$GITHUB_OUTPUT" || exit 1
            exit 0
          fi

          # --no-renames: a renamed file's OLD path is classified too, so the
          # files still naming it are found (selection's reference walk).
          changed="$(git diff --name-only --no-renames "$base" HEAD)"
          echo "Changed against ${base}:"
          echo "${changed:-  (nothing)}"

          # Affected-only selection (see `outputs.jobs`). A selector crash
          # selects everything; if even that fails, this step FAILS (ci-gate
          # then fails) rather than emitting no jobs and skipping them all.
          if ! selected="$(printf '%s\n' "$changed" | python3 tools/ci/select_jobs.py --event "$GITHUB_EVENT_NAME")"; then
            echo "::warning::job selection failed; running every job"
            selected="$(python3 tools/ci/select_jobs.py --all --event "$GITHUB_EVENT_NAME")" || exit 1
          fi
          echo "$selected"
          printf '%s\n' "$selected" | grep -E '^jobs=\|.+\|$' >> "$GITHUB_OUTPUT" || exit 1
          # The net group may also be needed by the selection's reach (a
          # tools/ harness piece a net smoke loads); never let the
          # presentation filter below drop it then.
          selected_net="$(printf '%s\n' "$selected" | sed -n 's/^net=//p')"

          # Fail safe: an empty diff builds rather than silently shipping.
          #
          # NOT `grep -q` in a pipeline. `set -o pipefail` is on, and `grep -q`
          # exits the instant it matches -- which closes the pipe, kills the
          # upstream `printf` with SIGPIPE (141), and makes pipefail report the
          # whole pipeline as FAILED even though grep succeeded. The `if` then
          # took the else branch and skipped the entire build.
          #
          # It only bites when the diff is long enough that printf is still
          # writing when grep exits, and when a non-doc path sorts early. Both
          # were true on 2026-08-26: ralph/GRASS-CONSOLIDATE changed 767 files
          # including ci.yml, shaders/, scripts/world/ and tests/ -- and CI
          # reported SUCCESS in 50 seconds with 27 of 28 jobs skipped. A green
          # tick on a run that tested nothing is the worst failure this file can
          # produce, and it nearly landed an untested grass consolidation.
          #
          # Capturing the non-matching lines first lets grep read all of stdin,
          # so there is no early exit and no SIGPIPE. `|| true` because grep
          # exits 1 when it finds nothing, which here means "docs only".
          noncode="$(printf '%s\n' "$changed" \
            | grep -vE '(\.md$|^site/|^docs/|^ralph/|^archive/|^\.claude/)' || true)"
          if [ -z "$changed" ] || [ -n "$noncode" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Documentation only; skipping the build."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

          # MULTIPLAYER GROUP SKIP (owner, 2026-10-04: skip jobs a change
          # cannot affect). The net group (discover-net-smokes, the eighteen
          # verify-multiplayer-shard jobs, veridian-offer and the Cloudreach
          # mid-ride rejoin) is the longest queue in a full run. It is skipped ONLY
          # when every non-documentation path changed is presentation that a
          # two-peer smoke cannot observe: image/audio media and their .import
          # sidecars, .gdshader files, data/config/*_{visual,atmosphere,
          # horizon,camera,lighting,presentation,audio}.json, unit/capture
          # test files (unit tests still run in verify-unit-tests), and tools/
          # outside tools/net/ and tools/ci/. Meshes (.glb/.gltf/.tscn) are NOT
          # on the list: their collision can move a body. An empty diff, a
          # missing base, a schedule or a dispatch always runs the group.
          # Same SIGPIPE-safe capture as `noncode` above.
          netrelevant="$(printf '%s\n' "$noncode" \
            | grep -vE '(\.(png|jpe?g|webp|ktx2|exr|hdr|svg|ogg|wav|mp3)(\.import)?$|\.gdshader(\.uid)?$|^data/config/[a-z0-9_]+_(visual|atmosphere|horizon|camera|lighting|presentation|audio)\.json$|^tests/(test|capture)_[a-z0-9_]+\.gd(\.uid)?$|^tools/([^nc]|n[^e]|ne[^t]|net[^/]|c[^i]|ci[^/]))' || true)"
          if [ -z "$changed" ] || [ -n "$netrelevant" ] || [ "${selected_net:-true}" = true ]; then
            echo "net=true" >> "$GITHUB_OUTPUT"
          else
            echo "Presentation-only change; the multiplayer group will skip."
            echo "net=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide the tier (fast on every PR/push, full every 8 hours)
        id: tier
        env:
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          DISPATCH_TIER: ${{ inputs.tier || 'full' }}
        run: |
          if [ "${{ steps.filter.outputs.code }}" != "true" ]; then
            echo "full=false" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ] || [ "$FULL_LABEL" = "true" ] \
               || { [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$DISPATCH_TIER" != "fast" ]; }; then
            echo "Full tier."
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "Fast tier; the full suite runs every 8 hours on main (or label the PR full-ci)."
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Plan the verify-suite jobs
        id: suites
        env:
          CODE: ${{ steps.filter.outputs.code }}
          FULL: ${{ steps.tier.outputs.full }}
          JOBS: ${{ steps.filter.outputs.jobs }}
        run: |
          set -euo pipefail
          tier=none
          if [ "$FULL" = true ]; then tier=full; elif [ "$CODE" = true ]; then tier=fast; fi
          python3 tools/ci/run_suite.py --list --tier "$tier" --jobs "$JOBS"

  # CI-SPEED (owner, 2026-10-07): ONE matrix job for every single-process
  # verification job that used to hold its own runner -- the unit-test shards,
  # verify-harvest, -core-verb-shard, -catching, -gate-a-ui-build-shard,
  # -combat-shard, -regions-shard (world, stormwood, tidewake),
  # -regions-relay (meadows), -owner-regressions-shard (catching, controls),
  # -gate-evidence-shard, -gate-evidence-finale (both segments), -gate-b-core
  # and -segment-handoffs. Each is now a GROUP file under tools/ci/suites/
  # holding that job's steps verbatim; tools/ci/run_suite.py plans the groups
  # longest first onto 4 suites x 2 lanes and runs a suite's two lanes at once,
  # each lane in its own XDG_DATA_HOME, RUNNER_TEMP and network namespace
  # (what a separate runner used to give each job). Before: 20 jobs, ~180
  # runner-minutes, ~45 of them checkout/setup, competing for ~17 free runners
  # with the net shards (PR #573 run 37627797865). The same steps, retries
  # and assertions run; the fast tier still runs the unit-test groups.
  verify-suite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.changes.outputs.suites || '[]') }}
    timeout-minutes: 45
    needs: changes
    if: needs.changes.outputs.suites != '' && needs.changes.outputs.suites != '[]'
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/ralph/
            !/docs/
            !/shots/
            !/assets_raw/
            !/archive/

      # The named-location ledger test (unit shards) reads eight small,
      # immutable acceptance receipts under ralph/reports. Keep the large
      # evidence tree sparse, but materialise the exact blobs the existing
      # assertions read from this commit so CI tests the same evidence as a
      # full checkout.
      - name: Materialize committed Meadows evidence fixtures
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            mkdir -p "$(dirname "$path")"
            git show "HEAD:$path" > "$path"
          done <<'EOF'
          ralph/reports/MEADOWS-0912/THE-RISE-IDENTITY-R33/manifest.json
          ralph/reports/MEADOWS-0912/THE-RISE-IDENTITY-R33/BLIND_REVIEW.md
          ralph/reports/MEADOWS-0912/OLD-QUARRY-TERRACE-R55-DESKTOP-01/manifest.json
          ralph/reports/MEADOWS-0912/OLD-QUARRY-TERRACE-R55-DESKTOP-01/independent-blind-review.md
          ralph/reports/MEADOWS-0912/final-old-mill-63-desktop-01/manifest.json
          ralph/reports/MEADOWS-0912/final-old-mill-63-desktop-01/BLIND_REVIEW.md
          ralph/reports/MEADOWS-0912/final-warrens-62-desktop-01/manifest.json
          ralph/reports/MEADOWS-0912/final-warrens-62-desktop-01/BLIND_REVIEW.md
