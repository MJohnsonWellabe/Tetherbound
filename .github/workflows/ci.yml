name: CI

# Three checks, in the order they catch things:
#
#   1. the project imports from a clean checkout with no script errors
#   2. the tests pass
#   3. the Windows executable actually exports
#
# The point is that a broken project fails here rather than when the owner next
# opens the editor or, worse, at the end of a milestone when the export is
# tried for the first time. Export templates are a 1.2 GB download, which is
# why they are cached.
#
# What this CANNOT check: whether the game feels good. That is the owner
# playing it on the Ally, and no amount of green here substitutes.
#
# The twelve checks (unit suite + eleven smoke tests) each run as their OWN
# parallel job instead of being grouped into two jobs of five-plus-one. This
# is the same trade the previous split (one job of eleven -> two jobs of
# five-plus-six) already made, carried one step further, for the same reason:
# less wall-clock on a pipeline this project watches dozens of times a day, at
# the cost of each job paying its own checkout/import setup again.
#
# Measured on 2026-08-15, real `ralph/**` branch runs (not the docs-only skip
# path): `verify-core` alone (unit suite + 5 smoke tests, sequential inside
# one job) took ~16m47s, and was the long pole — `verify-scenarios` (its own
# 5 smoke tests) finished in ~9m52s in parallel alongside it, so overall wall
# time tracked verify-core's ~17 minutes, not the ~5.2 minutes a stale note
# elsewhere in this repo (ralph/PROMPT.md, corrected in the same change that
# added this comment) still claimed. Godot install was already a cache hit in
# that run and cost near-nothing; the real cost was test execution itself --
# "Run tests" (unit suite) ~3m25s, and the five smoke tests inside
# verify-core summing to ~11m52s with `smoke_traversal.gd` alone at ~5m59s,
# the single worst step in the whole pipeline. That is sequential-inside-one-
# job time that parallel jobs turn into wall-clock nobody waits through
# serially: splitting every check into its own job bounds the critical path
# at (shared setup) + (the single slowest check) instead of (shared setup) +
# (the sum of five checks).

on:
  push:
    # `ralph/**` is here because it is the loop's ship action. Ralph's sessions
    # cannot open a pull request, so pushing the branch is the only signal they
    # can send, and ralph-merge.yml only lands a branch whose CI went green.
    # Leaving it out meant CI never ran on those branches at all, so the merge
    # workflow sat waiting on a success that could not arrive -- the loop would
    # have pushed work forever and shipped none of it.
    branches: [main, 'claude/**', 'ralph/**']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes the run in flight — except on
# main, where every run is kept: Release publishes from main and a cancelled
# verification there would mean shipping on a run nobody finished.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Pinned deliberately. See docs/decisions/D01-godot-version-and-renderer.md.
  # Export templates must match the editor exactly or the export fails with a
  # message that does not obviously say "version mismatch".
  GODOT_VERSION: 4.7-stable

jobs:
  # Roughly half of this workflow's runs change nothing but markdown: the loop
  # pushes a `<task-id>-record` branch after every task, carrying edits to
  # BACKLOG.md, DONE.md and BLOCKED.md and nothing else. Each one used to spend
  # a full build exporting a Windows executable to verify a changed bullet.
  #
  # The obvious fix -- `paths-ignore: ['**.md']` on the push trigger -- is a
  # trap, and an expensive one. For push events a non-matching path filter means
  # GitHub creates NO workflow run at all. No run means no `workflow_run` event,
  # and ralph-merge.yml triggers on exactly that, so a doc-only branch would
  # never merge, never be deleted, and could not be deleted from a Ralph session
  # either (the git proxy refuses `push --delete`). It would strand precisely
  # the branches the loop depends on, and leave nothing red to notice it by.
  #
  # So the run must still happen. This job is what makes it happen: it always
  # runs, so the run always has an executed job and always concludes `success`,
  # which is the only thing ralph-merge.yml reads. Every `verify-*` job below
  # then skips itself when there is nothing to verify. Skipped jobs do not
  # change a run's conclusion -- but a run where EVERY job skipped concludes
  # `skipped`, not `success`, and would be refused. Keep this job unconditional.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed to diff against a base that may be many commits back.
          fetch-depth: 0

      - name: Decide whether anything but documentation changed
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail

          # No-build paths: markdown anywhere, and the four trees the game
          # binary never loads -- the website (published by Release, not
          # compiled), docs/ (reference images feed the visual-judge skill,
          # not the build), ralph/ (the loop's bookkeeping), and .claude/
          # (skills). A .json under data/ or a workflow file can reach the
          # export, so those still get the full build. Screenshot refreshes
          # were costing a full build per JPEG before site/ was here.
          base=""
          if [ -n "${BASE_SHA:-}" ]; then
            base="$BASE_SHA"
          elif [ -n "${BEFORE:-}" ] \
               && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            # A branch's first push has no usable `before`.
            git fetch --no-tags --depth=0 origin main 2>/dev/null || true
            base="$(git merge-base origin/main HEAD 2>/dev/null || true)"
          fi

          if [ -z "$base" ]; then
            echo "No usable base commit; building."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$base" HEAD)"
          echo "Changed against ${base}:"
          echo "${changed:-  (nothing)}"

          # Fail safe: an empty diff builds rather than silently shipping.
          if [ -z "$changed" ] || printf '%s\n' "$changed" | grep -qvE '(\.md$|^site/|^docs/|^ralph/|^\.claude/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Documentation only; skipping the build."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  verify-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.code == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot editor and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          mkdir -p ~/godot-bin
          curl -sSL -o /tmp/godot.zip "${BASE}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp
          mv "/tmp/Godot_v${GODOT_VERSION}_linux.x86_64" ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

          curl -sSL -o /tmp/templates.tpz "${BASE}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp
          # Godot looks for the directory named after the version as it reports
          # it: "4.7.stable", not "4.7-stable".
          TEMPLATE_DIR=~/.local/share/godot/export_templates/${GODOT_VERSION/-/.}
          mkdir -p "$(dirname "$TEMPLATE_DIR")"
          mv /tmp/templates "$TEMPLATE_DIR"

      - name: Add Godot to PATH
        run: echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      - name: Cache the import artifacts
        # .godot/ is the imported form of every texture and scene. Without
        # this the cold import re-processes the whole asset tree (~a minute)
        # on every run; with it, only assets the push actually changed are
        # re-imported. The hash key means an exact match on an unchanged
        # asset tree, and restore-keys means a near match still starts warm.
        # Shared across every job in this workflow that needs it — a
        # concurrent restore from more than one job is safe; a concurrent
        # save of a key that doesn't exist yet just leaves one winner, which
        # actions/cache tolerates without failing the step.
        uses: actions/cache@v4
        with:
          path: .godot
          key: import-${{ env.GODOT_VERSION }}-${{ hashFiles('project.godot', '**/*.import') }}
          restore-keys: import-${{ env.GODOT_VERSION }}-

      - name: Import project (cold)
        # The FIRST import on a clean checkout exits non-zero. Terrain3D's
        # GDExtension registers its classes during that cold scan and Godot
        # aborts on shutdown afterwards, AFTER the import work has completed.
        # Verified: the abort happens with the terrain data removed entirely,
        # and the second pass is clean and instant, so the cache it wrote is
        # good. Tolerated here rather than hidden — the pass below is the one
        # that has to be green.
        run: godot --headless --path . --import || true

      - name: Import project (verify)
        # The authoritative import check, in one pass rather than two. A
        # non-zero exit is a real failure on its own (a malformed
        # project.godot, a crash) -- `pipefail` makes that survive the `tee`.
        # But Godot's own exit code is not sufficient by itself: a script
        # that no longer parses or a scene referencing a missing resource
        # can print SCRIPT ERROR / Parse Error and still exit 0, so the log
        # text is inspected too. This used to be two full import passes (one
        # for the exit code, a second identical one purely to capture text
        # to grep) -- merged 2026-08-15 into the one pass that already has
        # the output in hand.
        run: |
          set -euo pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/import.log
          if grep -qiE "SCRIPT ERROR|Parse Error|Failed to load|ERROR: Cannot open" /tmp/import.log; then
            echo "::error::import produced script or resource errors"
            exit 1
          fi

      - name: Run tests
        # The unit suite itself: several hundred tests, real minutes now, not
        # the "a few seconds" an earlier version of this comment claimed
        # (measured 2026-08-15: ~3m25s) — worth its own job now that jobs run
        # in parallel instead of piggybacking on a smoke-test job "because it's
        # cheap".
        run: godot --headless --path . --script tests/run_tests.gd

  verify-playground:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.code == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot editor and export templates
