          fi

      - name: Smoke-test the menu
        # Opens the pause menu over the real world and closes it again. Unit
        # tests cover the satchel's arithmetic and the five-creature cap; none of
        # them can see the four things that make a menu shippable or not:
        # the mouse is released and RESTORED to what it was (the world captures
        # it and never gives it back), the tree actually pauses so the player
        # is not walking while reading, something holds focus and the focus
        # neighbours resolve — this ships on a handheld and a menu that needs a
        # mouse is broken — and the menu yields the Escape/B button while a
        # fight is running, because `menu_cancel` and `combat_run` share it.
