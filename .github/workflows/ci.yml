    needs: changes
    # CI-SPEED (owner, 2026-10-07): NIGHTLY ONLY -- vegetation/scatter placement data regression; runs on the 8-hourly schedule and on dispatch, not on a full-ci PR.
    if: needs.changes.outputs.full == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (contains(needs.changes.outputs.jobs, '|ALL|') || contains(needs.changes.outputs.jobs, '|verify-scatter-rules|'))

    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch commits and trees but no blobs, then materialise only the
          # paths a verification job actually reads. `changes` already proved
          # blob:none works here. The four excluded trees are 1.20 GB of the
          # 2.08 GB tracked tip and no job reads any of them: this file's own
          # no-build filter below already classes ralph/ and docs/ as paths
          # that do not trigger a build, shots/ and ralph/reports are capture
          # OUTPUT, and assets_raw/ is listed in .gitignore as material that
          # should never have been committed. Measured: 2.1 GB -> 895 MB of
          # working tree, importing clean and passing smoke + unit shard.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/ralph/
            !/docs/
            !/shots/
            !/assets_raw/
            !/archive/
      - uses: ./.github/actions/setup-godot
      - name: Run the scatter rules regression checks
        run: |
          godot --headless --path . --script tests/run_tests.gd \
            -- --only=test_scatter_rules.gd

  verify-regions-relay:
    # Split from verify-regions-shard (CI wall-clock): identical steps, own runner.
    runs-on: ubuntu-latest
    # Independent original checks; the matrix retains an exact one-time cover.
    strategy:
