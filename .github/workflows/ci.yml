  verify-continuous-core-known-red:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    # This is an investigation probe, not a release gate: it is explicitly
    # allowed to fail and currently repeats a costly whole-world opening drive
    # already covered by the two required opening smoke jobs above. Running it
    # on every push made normal CI slower while producing no actionable pass/
    # fail signal. Keep the exact command available to a deliberate manual
    # dispatch, where a developer can inspect its known-red result.
    if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.code == 'true'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch commits and trees but no blobs, then materialise only the
          # paths a verification job actually reads. `changes` already proved
          # blob:none works here. The four excluded trees are 1.20 GB of the
          # 2.08 GB tracked tip and no job reads any of them: this file's own
          # no-build filter below already classes ralph/ and docs/ as paths
          # that do not trigger a build, shots/ and ralph/reports are capture
          # OUTPUT, and assets_raw/ is listed in .gitignore as material that
          # should never have been committed. Measured: 2.1 GB -> 895 MB of
          # working tree, importing clean and passing smoke + unit shard.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/ralph/
            !/docs/
            !/shots/
            !/assets_raw/
            !/archive/
      - uses: ./.github/actions/setup-godot
      - name: Verify the village, material and paid-build continuation (KNOWN RED)
        run: |
          set -euo pipefail
          godot --headless --path . --script tests/smoke_gate_a_opening_segment.gd -- --gate-a-continuous-core

  # Main only. Ralph dispatches CI after a clean branch rebase; treating that
  # workflow_dispatch as an export request made every rebase pay this tail.
  # The export tail was ~40% of every branch
  # run, and it duplicates work: Release re-exports main itself before
  # publishing, so a broken export can never reach the download link through
  # a branch — it would surface on main's own run, where fixing red main is
  # the loop's standing first priority. Split into its own job (rather than
  # trailing steps in a verify job) so it starts only once EVERY verify-*
  # job has actually passed — `needs:` on all of them waits for every one.
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - changes
      - verify-unit-tests
      - verify-veg-corridor
      - verify-scatter-rules
      - verify-harvest
      - verify-core-verb-shard
      - verify-gate-a-ui-build-shard
      - verify-combat-shard
      - verify-regions-shard
      - verify-owner-regressions-shard
      - verify-gate-evidence-shard
    if: |
      needs.changes.outputs.code == 'true' &&
      github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot editor and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          mkdir -p ~/godot-bin
          curl -sSL -o /tmp/godot.zip "${BASE}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp
          mv "/tmp/Godot_v${GODOT_VERSION}_linux.x86_64" ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

          curl -sSL -o /tmp/templates.tpz "${BASE}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp
          TEMPLATE_DIR=~/.local/share/godot/export_templates/${GODOT_VERSION/-/.}
          mkdir -p "$(dirname "$TEMPLATE_DIR")"
          mv /tmp/templates "$TEMPLATE_DIR"

      - name: Add Godot to PATH
        run: echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      - name: Cache the import artifacts
        uses: actions/cache@v4
        with:
          path: .godot
          key: import-${{ env.GODOT_VERSION }}-${{ hashFiles('project.godot', '**/*.import') }}
          restore-keys: import-${{ env.GODOT_VERSION }}-

      - name: Import project (cold)
        run: godot --headless --path . --import || true

      - name: Import project (verify)
        run: godot --headless --path . --import

      - name: Export Windows build
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-debug "Windows Desktop" build/windows/Tetherbound.exe

      - name: Verify the export is a real Windows binary
        # An export can "succeed" and leave a stub behind. Check the file is
        # actually a PE executable and is not implausibly small.
        run: |
          set -euo pipefail
          file build/windows/Tetherbound.exe
          file build/windows/Tetherbound.exe | grep -q "PE32+ executable"
          SIZE=$(stat -c%s build/windows/Tetherbound.exe)
          echo "exe size: ${SIZE} bytes"
          test "$SIZE" -gt 10000000

      - name: Verify the exported build runs and has ground under the player
        # Exports for Linux and RUNS it. Every other test in this file runs the
        # project from source, where res:// is a real directory and addons load
        # from the project tree — so none of them can see an export-only fault.
        # A build shipped with no terrain in it and all of them were green.
        run: |
          sudo apt-get install -y -qq xvfb >/dev/null
          tools/verify_export.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Tetherbound-windows-debug
          path: build/windows/
          retention-days: 14
