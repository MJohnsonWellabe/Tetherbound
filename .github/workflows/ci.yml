          if grep -qiE "SCRIPT ERROR|Parse Error|Failed to load|ERROR: Cannot open" /tmp/import.log; then
            echo "::error::import produced script or resource errors"
            exit 1
          fi

      - name: Smoke-test the opening
        # Walks the first fifteen minutes end to end: fade in, approach
        # Grandpa, talk, choose a starter, name it with the pad, and confirm
        # the creature reaches the real party. This wires SequenceDirector,
        # InteractionArbiter, DialoguePanel and NamePrompt together for the
        # first time in the run — a regression here is a player who spawns
        # with no opening at all, and nothing else in this job would notice.
        run: godot --headless --path . --script tests/smoke_opening.gd

      - name: Smoke-test the starter picker's input reads
        # The blind playtest's P0, kept fixed: a `ui_right` and a `menu_confirm`
        # in the SAME physics frame used to destroy the confirm, so the orb
        # picker could not be confirmed and the opening could not be finished.
        # smoke_opening above drives the picker with presses frames apart, which
        # always worked — this is the collision itself, and it runs in seconds
        # because it instantiates the picker alone.
        run: godot --headless --path . --script tests/smoke_starter_picker.gd

      - name: Smoke-test modal stacking
        # The pause shell must refuse to open over a screen the player has to
        # answer — the starter orbs, a conversation. It used to open straight on
        # top of both, drawing over a selector that could no longer be reached.
        run: godot --headless --path . --script tests/smoke_modal_stacking.gd

