  # does not say "slow": the last line is a passing `test_marking_*` test and
  # then nothing until `The operation was canceled`, which reads like a hang.
  #
  # Deliberately NOT a raised ceiling and NOT more shards. The ceiling was
  # already raised twice and this file's own note forbids a third. More shards
