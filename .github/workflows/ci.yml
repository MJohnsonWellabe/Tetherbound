name: CI

# Three checks, in the order they catch things:
#
#   1. the project imports from a clean checkout with no script errors
#   2. the tests pass
#   3. the Windows executable actually exports
#
# The point is that a broken project fails here rather than when the owner next
# opens the editor or, worse, at the end of a milestone when the export is
# tried for the first time. Export templates are a 1.2 GB download, which is
# why they are cached.
#
# What this CANNOT check: whether the game feels good. That is the owner
# playing it on the Ally, and no amount of green here substitutes.
#
# JOB COUNT REWORK, 2026-09-01 (owner directive: "having one hour CIs is
# unacceptable... we're just not sitting through that long of testing").
#
# MEASURED, not guessed, on real `ralph/**` runs the same day (run 33451229763,
# 59 jobs, GitHub API job timestamps): every job's own "run" duration (queued
# time excluded) was short -- sum of all 57 executed jobs' run time was only
# 10,187s (~170 runner-minutes), average 173s/job. The run still took 45m46s
# wall clock. The gap is queueing: average queue wait per job was 1,044s
# (17.4 minutes), worst case 2,089s (34.8 minutes) for a single job that then
# ran in 69 seconds. This project runs a fleet of many concurrent `ralph/**`
# lanes, each push spawning its own ~58-job matrix, and GitHub's account-wide
# concurrent-runner limit means those jobs queue behind every other lane's
# jobs -- so a design built to bound wall-clock at "checkout once + the
# slowest single check" instead produces up to 58 separate tickets in the
# same queue, competing with every other lane's 58 tickets. Fixing any one
# job's own runtime does not touch this; only fewer jobs per push does,
# because job COUNT is what is actually scarce.
#
# So the six jobs below that used to fan a `strategy: matrix` out into one
# job PER SMOKE TEST (43 separate jobs across the six) now run their smoke
# tests as sequential STEPS inside one job each -- one checkout, one Godot
# setup, same tests, same retry counts, same pass/fail per test (a failing
# step does not skip the rest; see each job's `if: ${{ !cancelled() }}`).
# `verify-unit-tests` drops from 10 shards to 4: the three files that ever
# threatened a shard's 12-minute ceiling (test_veg_corridor.gd,
# test_scatter_rules.gd, test_harvest.gd) already have their own dedicated
# jobs below and are excluded from this shard's file list, so the shard's
# real remaining cost -- measured the same run at ~108s/shard average across
# 10 shards, 1,084s total -- has never needed 10-way splitting since that
# carve-out landed. Four shards keeps real parallelism with ~2.5x headroom
# under the ceiling instead of manufacturing job count the queue has to pay
# for.
#
# BEFORE / AFTER (2026-09-01 measurement, run 33451229763's job list):
#   Job count on a `ralph/**` push:        57 executed jobs -> 15
#   Sum of per-job "run" time (real work): 10,187s          -> ~10,000s (unchanged --
#     same tests, same assertions; consolidation moves WHERE checkout/setup
#     cost lands, not how much test execution happens)
#   Longest single job (wall, sequential): ~514s (one smoke leg) -> ~1,478s
#     (verify-gate-evidence-shard's 8 tests summed) -- the expected trade:
#     fewer tickets in the queue, a longer critical path once a job actually
#     starts. Still comfortably inside each job's own timeout-minutes below.
#   Observed queue wait that this run actually paid: up to 2,089s (34.8 min)
#     per job, average 1,044s -- the thing 42 fewer jobs per push is aimed at.
#     Exact post-fix queue time cannot be measured until this fix is itself
#     live across the fleet (queueing is a function of every lane's job count,
#     not just this branch's), but a ~74% cut in this workflow's own job
#     count is a ~74% cut in what it asks the shared runner pool for per push.
#
# No coverage was removed: every smoke test, every retry count, and the same
# unit-test file set still run on every push. What changed is which of them
# share a checkout.

on:
  push:
    # `ralph/**` is here because it is the loop's ship action. Ralph's sessions
    # cannot open a pull request, so pushing the branch is the only signal they
    # can send, and ralph-merge.yml only lands a branch whose CI went green.
    # Leaving it out meant CI never ran on those branches at all, so the merge
    # workflow sat waiting on a success that could not arrive -- the loop would
    # have pushed work forever and shipped none of it.
    branches: [main, 'claude/**', 'ralph/**']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes the run in flight — except on
# main, where every run is kept: Release publishes from main and a cancelled
# verification there would mean shipping on a run nobody finished.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Pinned deliberately. See docs/decisions/D01-godot-version-and-renderer.md.
  # Export templates must match the editor exactly or the export fails with a
  # message that does not obviously say "version mismatch".
  GODOT_VERSION: 4.7-stable

jobs:
  # Roughly half of this workflow's runs change nothing but markdown: the loop
  # pushes a `<task-id>-record` branch after every task, carrying edits to
  # BACKLOG.md, DONE.md and BLOCKED.md and nothing else. Each one used to spend
  # a full build exporting a Windows executable to verify a changed bullet.
  #
  # The obvious fix -- `paths-ignore: ['**.md']` on the push trigger -- is a
  # trap, and an expensive one. For push events a non-matching path filter means
  # GitHub creates NO workflow run at all. No run means no `workflow_run` event,
  # and ralph-merge.yml triggers on exactly that, so a doc-only branch would
  # never merge, never be deleted, and could not be deleted from a Ralph session
  # either (the git proxy refuses `push --delete`). It would strand precisely
  # the branches the loop depends on, and leave nothing red to notice it by.
  #
  # So the run must still happen. This job is what makes it happen: it always
  # runs, so the run always has an executed job and always concludes `success`,
  # which is the only thing ralph-merge.yml reads. Every `verify-*` job below
  # then skips itself when there is nothing to verify. Skipped jobs do not
  # change a run's conclusion -- but a run where EVERY job skipped concludes
  # `skipped`, not `success`, and would be refused. Keep this job unconditional.
  changes:
    runs-on: ubuntu-latest
    # Was 5, which this job's own checkout outgrew. A `timeout-minutes` kill
    # reports as CANCELLED, not failed, and every downstream job then skips --
    # so the run looks like a tidy no-op rather than a job that died. Raised as
    # a safety net only; `filter: blob:none` below is the actual fix.
    timeout-minutes: 15
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed to diff against a base that may be many commits back.
          fetch-depth: 0
          # BLOBLESS. This job runs `git diff --name-only` and `git merge-base`
          # and nothing else -- both want commits and trees, never file
          # contents. Without this, `fetch-depth: 0` downloads every version of
          # every file in the branch's whole ancestry, and this repo's ancestry
          # is roughly 300 baked scatter binaries per bake.
          #
          # It went from a 45-second checkout on 2026-08-26's run 2515 to over
          # five minutes on run 2520, whose branch consolidated five lanes that
          # each carried their own full bake -- about eleven thousand large
          # blobs fetched to look at a list of filenames. Consolidating lanes is
          # still the right call for CI cost, but it multiplies exactly this,
          # so the filter is what keeps it affordable.
          filter: blob:none

      - name: Decide whether anything but documentation changed
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail

          # No-build paths: markdown anywhere, and the four trees the game
          # binary never loads -- the website (published by Release, not
          # compiled), docs/ (reference images feed the visual-judge skill,
          # not the build), ralph/ (the loop's bookkeeping), and .claude/
          # (skills). A .json under data/ or a workflow file can reach the
          # export, so those still get the full build. Screenshot refreshes
          # were costing a full build per JPEG before site/ was here.
          #
          # BASE CHOICE, corrected 2026-09-02. Diffing a branch push against
          # `github.event.before` (the branch's previous push) is how a
          # branch that pushed code, then pushed a report, got every verify
          # job SKIPPED on the second push and a 75-second `success` --
          # three times in one day, with the code never executed. A branch
          # is verified against what it would land on `main`, so for any
          # push that is not to `main` itself the base is the merge-base
          # with `origin/main`. Pushes to `main` keep `before`: there the
          # previous tip is exactly what changed.
          base=""
          if [ -n "${BASE_SHA:-}" ]; then
            base="$BASE_SHA"
          elif [ "${GITHUB_REF_NAME:-}" != "main" ]; then
            git fetch --no-tags --depth=0 origin main 2>/dev/null || true
            base="$(git merge-base origin/main HEAD 2>/dev/null || true)"
          elif [ -n "${BEFORE:-}" ] \
               && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            # A branch's first push has no usable `before`.
            git fetch --no-tags --depth=0 origin main 2>/dev/null || true
            base="$(git merge-base origin/main HEAD 2>/dev/null || true)"
          fi

          if [ -z "$base" ]; then
            echo "No usable base commit; building."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$base" HEAD)"
          echo "Changed against ${base}:"
          echo "${changed:-  (nothing)}"

          # Fail safe: an empty diff builds rather than silently shipping.
          #
          # NOT `grep -q` in a pipeline. `set -o pipefail` is on, and `grep -q`
          # exits the instant it matches -- which closes the pipe, kills the
          # upstream `printf` with SIGPIPE (141), and makes pipefail report the
          # whole pipeline as FAILED even though grep succeeded. The `if` then
          # took the else branch and skipped the entire build.
          #
          # It only bites when the diff is long enough that printf is still
          # writing when grep exits, and when a non-doc path sorts early. Both
          # were true on 2026-08-26: ralph/GRASS-CONSOLIDATE changed 767 files
          # including ci.yml, shaders/, scripts/world/ and tests/ -- and CI
          # reported SUCCESS in 50 seconds with 27 of 28 jobs skipped. A green
          # tick on a run that tested nothing is the worst failure this file can
          # produce, and it nearly landed an untested grass consolidation.
          #
          # Capturing the non-matching lines first lets grep read all of stdin,
          # so there is no early exit and no SIGPIPE. `|| true` because grep
          # exits 1 when it finds nothing, which here means "docs only".
          noncode="$(printf '%s\n' "$changed" \
            | grep -vE '(\.md$|^site/|^docs/|^ralph/|^archive/|^\.claude/)' || true)"
          if [ -z "$changed" ] || [ -n "$noncode" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Documentation only; skipping the build."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # A dedicated, fast, unmissable check for exactly one regression class:
  # `data/scatter/playground` going stale against `vegetation.json` /
  # `terrain_playground.json` / a band's `vegetation.json` without a re-bake.
  # `test_playground_bake_is_committed_and_fresh` (below in
  # `verify-unit-tests`) already asserts this, but that is one file among
  # ~40 in one shard of four -- the exact shape that let this recur:
  # `main` @ 852fe366 sat CI-red on this single assertion in
  # `verify-unit-tests (4)` while every commit after it was documentation-only
  # and skipped the code jobs entirely, so the workflow badge read green and
  # nobody opened a shard log to find the one red line. A config edit
  # (`data/config/vegetation.json` or `data/config/grass_field.json`) landing
  # without its re-bake reintroduces the ~5-8 minute live-recompute stall
  # `ralph/reports/OWNER-0902-LOAD-TIME.md` root-caused from an owner
  # playtest complaint, on every single New Game / load.
  #
  # This job runs the SAME assertion `scatter_bake.gd::is_fresh()` backs --
  # no new check, no new fingerprint logic, nothing that can drift from what
  # `verify-unit-tests` already covers -- but as its own named job, so a
  # stale bake shows up as one red job in the run summary instead of a line
  # inside a shard's log, and finishes in about as long as the import cache
  # takes to restore, not gated behind the other ~40 files in its shard.
  #
  # Does NOT catch: a config edit that lands together with a correct re-bake
  # but describes the wrong intent (this only checks the fingerprint matches,
  # not that the bake is "good"). `data/terrain/playground` has its own,
  # separate equivalent check now: `verify-terrain-bake-freshness` below
  # (HARNESS-HYGIENE-0903). Does NOT re-bake or auto-commit anything --
  # failing here means a human or a lane runs `godot --headless --path .
  # --script scripts/world/bake_playground_scatter.gd` and commits the
  # result, same as today.
  verify-scatter-bake-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.code == 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/ralph/
            !/docs/
            !/shots/
            !/assets_raw/
            !/archive/
      - uses: ./.github/actions/setup-godot
      - name: Check the playground scatter bake is fresh
        run: |
          godot --headless --path . --script tests/run_tests.gd \
            -- --only=test_scatter_perf_budget.gd::test_playground_bake_is_committed_and_fresh

  # HARNESS-HYGIENE-0903. `data/terrain/playground`'s own equivalent of the
  # job above -- the gap the scatter job's own comment names ("anything about
  # data/terrain/playground, which has no equivalent freshness check at
  # all"). `terrain_playground.json` was edited (doc-path text in comments)
  # during the 2026-09-02 repository reset with no re-bake, and nothing on
  # disk or in CI could have caught it. Same shape as the job above: one
  # dedicated, fast, named job so a stale terrain bake shows up as one red
  # line in the run summary instead of buried in a shard's log.
  #
  # Does NOT catch a config edit that lands together with a correct re-bake
  # but describes the wrong intent. Does NOT re-bake or auto-commit anything
  # -- failing here means a human or a lane runs `godot --headless --path .
  # --script scripts/world/build_playground_terrain.gd` and commits the
  # result (region files AND manifest.json).
  verify-terrain-bake-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.code == 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/ralph/
            !/docs/
            !/shots/
            !/assets_raw/
            !/archive/
      - uses: ./.github/actions/setup-godot
      - name: Check the playground terrain bake is fresh
        run: |
          godot --headless --path . --script tests/run_tests.gd \
            -- --only=test_terrain_bake_freshness.gd::test_playground_terrain_bake_is_committed_and_fresh

  verify-unit-tests:
    runs-on: ubuntu-latest
    # FOUR shards, 2026-09-01 (down from ten). This shard's file list already
    # excludes test_veg_corridor.gd, test_scatter_rules.gd and test_harvest.gd
    # -- the three files whose per-file cost (not distribution) was the reason
    # this went 2 -> 4 -> 5 -> 6 -> 10 shards through 2026-08-25/26 (see the
    # git history of this comment for that saga; kept out of this file now to
    # stop it growing forever, not because it stopped being true). Those three
    # each have their own dedicated job below with its own generous ceiling.
    #
    # With them gone, this shard's remaining cost is small: measured
    # 2026-09-01 on real run 33451229763, ten shards summed to 1,084s of "Run
    # tests" time, ~108s/shard average, nowhere near the 12-minute ceiling.
    # Ten-way splitting was solving a problem that moved to the three
    # dedicated jobs weeks ago. Four shards keeps real parallelism (so one
    # slow file cannot silently dominate) with ~2.5x headroom per shard
    # instead of paying ten checkouts, ten Godot installs and ten import
    # passes for ~108s of test execution each -- exactly the job-count-vs-
    # queue-contention trade this whole rework is making (see this file's
    # header). If a single file is later found to dominate one of these four
    # shards, the fix is that file's own job on the test_veg_corridor.gd
    # pattern below, NOT a return to ten shards.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    timeout-minutes: 12
    needs: changes
    if: needs.changes.outputs.code == 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch commits and trees but no blobs, then materialise only the
          # paths a verification job actually reads. `changes` already proved
          # blob:none works here. The four excluded trees are 1.20 GB of the
          # 2.08 GB tracked tip and no job reads any of them: this file's own
          # no-build filter below already classes ralph/ and docs/ as paths
          # that do not trigger a build, shots/ and ralph/reports are capture
          # OUTPUT, and assets_raw/ is listed in .gitignore as material that
          # should never have been committed. Measured: 2.1 GB -> 895 MB of
          # working tree, importing clean and passing smoke + unit shard.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/ralph/
            !/docs/
            !/shots/
            !/assets_raw/
            !/archive/

      - name: Cache Godot editor and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          mkdir -p ~/godot-bin
          curl -sSL -o /tmp/godot.zip "${BASE}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp
          mv "/tmp/Godot_v${GODOT_VERSION}_linux.x86_64" ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

          curl -sSL -o /tmp/templates.tpz "${BASE}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp
          # Godot looks for the directory named after the version as it reports
          # it: "4.7.stable", not "4.7-stable".
          TEMPLATE_DIR=~/.local/share/godot/export_templates/${GODOT_VERSION/-/.}
          mkdir -p "$(dirname "$TEMPLATE_DIR")"
          mv /tmp/templates "$TEMPLATE_DIR"

      - name: Add Godot to PATH
        run: echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      - name: Cache the import artifacts
        # .godot/ is the imported form of every texture and scene. Without
        # this the cold import re-processes the whole asset tree (~a minute)
        # on every run; with it, only assets the push actually changed are
        # re-imported. The hash key means an exact match on an unchanged
        # asset tree, and restore-keys means a near match still starts warm.
        # Shared across every job in this workflow that needs it — a
        # concurrent restore from more than one job is safe; a concurrent
        # save of a key that doesn't exist yet just leaves one winner, which
        # actions/cache tolerates without failing the step.
        uses: actions/cache@v4
        with:
          path: .godot
          key: import-${{ env.GODOT_VERSION }}-${{ hashFiles('project.godot', '**/*.import') }}
          restore-keys: import-${{ env.GODOT_VERSION }}-

      - name: Import project (cold)
        # The FIRST import on a clean checkout exits non-zero. Terrain3D's
        # GDExtension registers its classes during that cold scan and Godot
        # aborts on shutdown afterwards, AFTER the import work has completed.
        # Verified: the abort happens with the terrain data removed entirely,
        # and the second pass is clean and instant, so the cache it wrote is
        # good. Tolerated here rather than hidden — the pass below is the one
        # that has to be green.
        run: godot --headless --path . --import || true

      - name: Import project (verify)
        # The authoritative import check, in one pass rather than two. A
        # non-zero exit is a real failure on its own (a malformed
        # project.godot, a crash) -- `pipefail` makes that survive the `tee`.
        # But Godot's own exit code is not sufficient by itself: a script
        # that no longer parses or a scene referencing a missing resource
        # can print SCRIPT ERROR / Parse Error and still exit 0, so the log
        # text is inspected too. This used to be two full import passes (one
        # for the exit code, a second identical one purely to capture text
        # to grep) -- merged 2026-08-15 into the one pass that already has
        # the output in hand.
        run: |
          set -euo pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/import.log
          if grep -qiE "SCRIPT ERROR|Parse Error|Failed to load|ERROR: Cannot open" /tmp/import.log; then
            echo "::error::import produced script or resource errors"
            exit 1
          fi

      - name: Run tests
        # The unit suite itself: several hundred tests, real minutes now, not
        # the "a few seconds" an earlier version of this comment claimed
        # (measured 2026-08-15: ~3m25s) — worth its own job now that jobs run
        # in parallel instead of piggybacking on a smoke-test job "because it's
        # cheap".
        run: |
          godot --headless --path . --script tests/run_tests.gd \
            -- --shard=${{ matrix.shard }}/4 --skip=test_veg_corridor.gd,test_scatter_rules.gd,test_harvest.gd

  # test_veg_corridor.gd, alone, in its own job with its own ceiling.
  #
  # It costs ~10 minutes by itself: measured 10m11s on ralph/WORLD-GRASS (6
  # tests, 1,341,749 assertions, 0 failed), against verify-unit-tests' 12-minute
  # timeout which also has to cover checkout, the Godot cache and two import
  # passes (~1m50s of that budget in run 2461). That is why shard 2 was killed
  # twice in a row at ~12.3 minutes on that branch, in a run whose other twelve
  # jobs were green -- and a timeout kill reports as CANCELLED, not failed,
  # which is what makes it read like infrastructure noise instead of a budget.
  #
  # WHY NOT A SEVENTH SHARD. verify-unit-tests' own note says to look for a real
  # per-test cost problem before reaching for one, and this is that problem:
  # once a single FILE exceeds the ceiling, sharding cannot help, because it
  # distributes files and cannot split one. A seventh shard would only move
  # which shard dies.
  #
  # WHY NOT RAISE THE CEILING. That file has been raised once (10 -> 12) and
  # split three times (2 -> 4 -> 5 -> 6), and its own note is explicit: "if this
  # starts clipping again, the fix is splitting run_tests.gd into two jobs, not
  # raising this further." This is that split, applied to the file that actually
  # costs the time, so the other ~40 test files keep a tight 12-minute ceiling
  # that still catches a real runaway.
  #
  # WHY NOT MAKE THE FILE CHEAPER. Its two whole-config RULES.all_placements()
  # calls are genuine regression checks over every layer against the real
  # corridor. The 2026-08-25 pass that shrank the other layer-reading tests
  # deliberately left these two alone -- see that file's own comments -- because
  # shrinking them would cut coverage rather than waste. Nothing here changes
  # what runs; only where.
  #
  # 25 minutes, not 12: ~10 minutes today with roughly 2.5x headroom, because
  # this file's cost scales with vegetation density and the grass work has
  # already moved it once (the bake went 466,922 -> 725,949 placements).
  verify-veg-corridor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    if: needs.changes.outputs.code == 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch commits and trees but no blobs, then materialise only the
          # paths a verification job actually reads. `changes` already proved
          # blob:none works here. The four excluded trees are 1.20 GB of the
          # 2.08 GB tracked tip and no job reads any of them: this file's own
          # no-build filter below already classes ralph/ and docs/ as paths
          # that do not trigger a build, shots/ and ralph/reports are capture
          # OUTPUT, and assets_raw/ is listed in .gitignore as material that
          # should never have been committed. Measured: 2.1 GB -> 895 MB of
          # working tree, importing clean and passing smoke + unit shard.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/ralph/
            !/docs/
            !/shots/
            !/assets_raw/
            !/archive/
      - uses: ./.github/actions/setup-godot
      - name: Run the corridor vegetation regression checks
        run: |
          godot --headless --path . --script tests/run_tests.gd \
            -- --only=test_veg_corridor.gd

  # test_scatter_rules.gd, alone, for the same reason test_veg_corridor.gd is.
  #
  # MEASURED 2026-08-26 on ralph/WORLD-GRASS's tree (725,949 placements), timing
  # every file in its shard individually: test_scatter_rules.gd is 850s of the
  # shard's 858s. The other ten files are one second each. That is not a
  # distribution problem and no shard count fixes it.
  #
  # It is why verify-unit-tests shard 2 was timeout-killed on that branch at both
  # SIX shards (10m49s) and TEN (10m50s) -- the ten-shard change moved nothing,
  # because this file lands in shard 2 either way and carries the whole cost.
  # A timeout kill reports as CANCELLED, not failed, which is what made it read
  # as infrastructure noise three separate times.
  #
