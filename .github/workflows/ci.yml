            echo "::error::import produced script or resource errors"
            exit 1
          fi

      - name: Smoke-test catching
        # Aims, misses, and lands a throw through injected input. Asserts the
        # things the catch maths cannot see: aiming hands the camera to the
        # trainer and abandons the creature, the orb is a projectile that can go
        # wide, an orb is spent on a throw and not on a cancel, and a faint is a
        # refusal rather than long odds.
        #
        # LP9: same tick-budget-vs-wall-clock retry as verify-combat below,
        # for the same measured reason — see that job's comment. The specific
        # failure this covers: the post-catch re-engage wait (a fixed
        # respawn-seconds-in-ticks budget) timing out for real under heavy
        # CI contention, reproduced locally at 16-way oversubscription with
        # no terrain-embedding signature in the position/velocity watchdog.
        run: |
          set +e
          godot --headless --path . --script tests/smoke_catching.gd
          code=$?
          if [ $code -ne 0 ]; then
            echo "::warning::smoke_catching failed once; retrying once before failing the job"
            godot --headless --path . --script tests/smoke_catching.gd
            code=$?
          fi
          exit $code

