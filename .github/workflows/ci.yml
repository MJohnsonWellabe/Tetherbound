name: CI

# Three checks, in the order they catch things:
#
#   1. the project imports from a clean checkout with no script errors
#   2. the tests pass
#   3. the Windows executable actually exports
#
# The point is that a broken project fails here rather than when the owner next
# opens the editor or, worse, at the end of a milestone when the export is
# tried for the first time. Export templates are a 1.2 GB download, which is
# why they are cached.
#
# What this CANNOT check: whether the game feels good. That is the owner
# playing it on the Ally, and no amount of green here substitutes.

on:
  push:
    # `ralph/**` is here because it is the loop's ship action. Ralph's sessions
    # cannot open a pull request, so pushing the branch is the only signal they
    # can send, and ralph-merge.yml only lands a branch whose CI went green.
    # Leaving it out meant CI never ran on those branches at all, so the merge
    # workflow sat waiting on a success that could not arrive -- the loop would
    # have pushed work forever and shipped none of it.
    branches: [main, 'claude/**', 'ralph/**']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes the run in flight — except on
# main, where every run is kept: Release publishes from main and a cancelled
# verification there would mean shipping on a run nobody finished.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Pinned deliberately. See docs/decisions/D01-godot-version-and-renderer.md.
  # Export templates must match the editor exactly or the export fails with a
  # message that does not obviously say "version mismatch".
  GODOT_VERSION: 4.7-stable

jobs:
  # Roughly half of this workflow's runs change nothing but markdown: the loop
  # pushes a `<task-id>-record` branch after every task, carrying edits to
  # BACKLOG.md, DONE.md and BLOCKED.md and nothing else. Each one spent about
  # nine minutes exporting a Windows executable to verify a changed bullet.
  #
  # The obvious fix -- `paths-ignore: ['**.md']` on the push trigger -- is a
  # trap, and an expensive one. For push events a non-matching path filter means
  # GitHub creates NO workflow run at all. No run means no `workflow_run` event,
  # and ralph-merge.yml triggers on exactly that, so a doc-only branch would
  # never merge, never be deleted, and could not be deleted from a Ralph session
  # either (the git proxy refuses `push --delete`). It would strand precisely
  # the branches the loop depends on, and leave nothing red to notice it by.
  #
  # So the run must still happen. This job is what makes it happen: it always
  # runs, so the run always has an executed job and always concludes `success`,
  # which is the only thing ralph-merge.yml reads. `verify` below then skips
  # itself when there is nothing to verify. Skipped jobs do not change a run's
  # conclusion -- but a run where EVERY job skipped concludes `skipped`, not
  # `success`, and would be refused. Keep this job unconditional.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed to diff against a base that may be many commits back.
          fetch-depth: 0

      - name: Decide whether anything but documentation changed
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail

          # No-build paths: markdown anywhere, and the four trees the game
          # binary never loads -- the website (published by Release, not
          # compiled), docs/ (reference images feed the visual-judge skill,
          # not the build), ralph/ (the loop's bookkeeping), and .claude/
          # (skills). A .json under data/ or a workflow file can reach the
          # export, so those still get the full build. Screenshot refreshes
          # were costing a nine-minute build per JPEG before site/ was here.
          base=""
          if [ -n "${BASE_SHA:-}" ]; then
            base="$BASE_SHA"
          elif [ -n "${BEFORE:-}" ] \
               && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            # A branch's first push has no usable `before`.
            git fetch --no-tags --depth=0 origin main 2>/dev/null || true
            base="$(git merge-base origin/main HEAD 2>/dev/null || true)"
          fi

          if [ -z "$base" ]; then
            echo "No usable base commit; building."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$base" HEAD)"
          echo "Changed against ${base}:"
          echo "${changed:-  (nothing)}"

          # Fail safe: an empty diff builds rather than silently shipping.
          if [ -z "$changed" ] || printf '%s\n' "$changed" | grep -qvE '(\.md$|^site/|^docs/|^ralph/|^\.claude/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Documentation only; skipping the build."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    if: needs.changes.outputs.code == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot editor and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          mkdir -p ~/godot-bin
          curl -sSL -o /tmp/godot.zip "${BASE}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp
          mv "/tmp/Godot_v${GODOT_VERSION}_linux.x86_64" ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

          curl -sSL -o /tmp/templates.tpz "${BASE}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp
          # Godot looks for the directory named after the version as it reports
          # it: "4.7.stable", not "4.7-stable".
          TEMPLATE_DIR=~/.local/share/godot/export_templates/${GODOT_VERSION/-/.}
          mkdir -p "$(dirname "$TEMPLATE_DIR")"
          mv /tmp/templates "$TEMPLATE_DIR"

      - name: Add Godot to PATH
        run: echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      - name: Cache the import artifacts
        # .godot/ is the imported form of every texture and scene. Without
        # this the cold import re-processes the whole asset tree (~a minute)
        # on every run; with it, only assets the push actually changed are
        # re-imported. The hash key means an exact match on an unchanged
        # asset tree, and restore-keys means a near match still starts warm.
        uses: actions/cache@v4
        with:
          path: .godot
          key: import-${{ env.GODOT_VERSION }}-${{ hashFiles('project.godot', '**/*.import') }}
          restore-keys: import-${{ env.GODOT_VERSION }}-

      - name: Import project (cold)
        # The FIRST import on a clean checkout exits non-zero. Terrain3D's
        # GDExtension registers its classes during that cold scan and Godot
        # aborts on shutdown afterwards, AFTER the import work has completed.
        # Verified: the abort happens with the terrain data removed entirely,
        # and the second pass is clean and instant, so the cache it wrote is
        # good. Tolerated here rather than hidden — the pass below is the one
        # that has to be green.
        run: godot --headless --path . --import || true

      - name: Import project (verify)
        # This is the authoritative import check. Non-zero here is a real
        # failure: a script that no longer parses, a scene referencing a
        # missing resource, a malformed project.godot.
        run: godot --headless --path . --import

      - name: Fail on script or scene errors
        run: |
          set -euo pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/import.log
          if grep -qiE "SCRIPT ERROR|Parse Error|Failed to load|ERROR: Cannot open" /tmp/import.log; then
            echo "::error::import produced script or resource errors"
            exit 1
          fi

      - name: Run tests
        run: godot --headless --path . --script tests/run_tests.gd

      - name: Smoke-test the playground
        # Boots the real main scene and asserts the terrain loaded, the player
        # was placed on it, and it is standing on collision. Unit tests cannot
        # see any of that. An earlier version of this check passed while NO
        # terrain was loaded at all, because it read a property that returned
        # null and skipped its own assertion; it now range-checks instead, and
        # is verified to fail when the baked terrain is removed.
        run: godot --headless --path . --script tests/smoke_playground.gd

      - name: Smoke-test the input path
        # Injects actions and asserts the character actually moves. Catches the
        # class of bug where input is read correctly and then silently
        # discarded — a null camera rig makes every direction resolve to zero
        # with no error anywhere. It cannot test the DEVICE layer; if hardware
        # does nothing while this passes, the fault is upstream of Godot.
        run: godot --headless --path . --script tests/smoke_input.gd

      - name: Smoke-test traversal
        # Walks ~190m per leg. A short walk proves only that the spawn point
        # works: collision_mode silently reverting to Dynamic/Game built ground
        # in a 64m bubble, and every other check passed inside it while the
        # player fell to y=-49950 outside it.
        run: godot --headless --path . --script tests/smoke_traversal.gd

      - name: Smoke-test combat
        # Walks up to a wild pal, engages, and PILOTS the fight to a win through
        # injected input (docs/decisions/D07). Asserts the things unit tests
        # cannot see: the pal actually moves on the stick, the arena boundary
        # holds it in without ending the fight, a swing at empty air is reported
        # as a miss, a swing at the opponent connects and earns energy, the
        # opponent closes and telegraphs and leaves an opening, and control and
        # camera come back afterwards.
        #
        # The bug this exists for: the deployed pal became a CharacterBody3D and
        # spent every run standing invisibly inside the trainer, so the two
        # bodies shoved each other and launched the player off the playground at
        # 500 m/s. Every unit test still passed.
        run: godot --headless --path . --script tests/smoke_combat.gd

      - name: Smoke-test catching
        # Aims, misses, and lands a throw through injected input. Asserts the
        # things the catch maths cannot see: aiming hands the camera to the
        # trainer and abandons the pal, the orb is a projectile that can go
        # wide, an orb is spent on a throw and not on a cancel, and a faint is a
        # refusal rather than long odds.
        run: godot --headless --path . --script tests/smoke_catching.gd

      - name: Smoke-test aggression
        # Two halves, and the second matters more: an aggressive pal must start
        # a fight on its own, and a peaceful one must never do so no matter how
        # long the trainer stands next to it. GAME_DESIGN.md §14 allows the
        # first and forbids the second, and one word in species.json is the only
        # thing between them.
        run: godot --headless --path . --script tests/smoke_aggression.gd

      - name: Smoke-test the opening
        # Walks the first fifteen minutes end to end: fade in, approach
        # Grandpa, talk, choose a starter, name it with the pad, and confirm
        # the pal reaches the real party. This wires SequenceDirector,
        # InteractionArbiter, DialoguePanel and NamePrompt together for the
        # first time in the run — a regression here is a player who spawns
        # with no opening at all, and nothing else in this job would notice.
        run: godot --headless --path . --script tests/smoke_opening.gd

      - name: Smoke-test the menu
        # Opens the pause menu over the real world and closes it again. Unit
        # tests cover the satchel's arithmetic and the five-pal cap; none of
        # them can see the four things that make a menu shippable or not:
        # the mouse is released and RESTORED to what it was (the world captures
        # it and never gives it back), the tree actually pauses so the player
        # is not walking while reading, something holds focus and the focus
        # neighbours resolve — this ships on a handheld and a menu that needs a
        # mouse is broken — and the menu yields the Escape/B button while a
        # fight is running, because `menu_cancel` and `combat_run` share it.
        #
        # What it CANNOT check headlessly: mouse capture itself. The dummy
        # DisplayServer reports VISIBLE whatever was asked for, so the test
        # verifies the menu records and restores the mode it found and says so
        # in its own output. The capture is the owner's to confirm on the Ally.
        run: godot --headless --path . --script tests/smoke_menu.gd

      - name: Smoke-test the settings screen
        # Rebinds controls through the real screen with injected input. The unit
        # tests cover the binding model and the settings file; none of them can
        # see the parts that decide whether this ships: that the tab is
        # reachable with the same button that changes tab everywhere else, that
        # focus moves across the two columns and down the rows (this is the
        # screen a player visits BECAUSE their controls are wrong, so it is the
        # last one allowed to need a mouse), that the capture reads raw events
        # ahead of the Control tree — a focused Button swallows the confirm
        # button, so a capture that read actions would never see anything — and
        # that binding `menu_cancel` to A does not close the menu on the very
        # press that bound it.
        #
        # It also exercises the panic chord, which reads the DEVICE rather than
        # the input map, because it is the way back when the input map is what
        # the player broke. It cleans up user://settings.json afterwards; a
        # stray override there would follow every later step in this job.
        run: godot --headless --path . --script tests/smoke_settings.gd

      - name: Smoke-test the free build toggle
        # A development toggle that changes what everything costs
        # (docs/decisions/D16). The unit tests cover the cost rule and the
        # settings file; this covers the parts that decide whether it is usable
        # and honest: that it is reachable from where the settings screen puts
        # the cursor with nothing but a stick, that the button says which way it
        # is set, that the Build tab admits materials are free the whole time it
        # is on — hidden, this reads later as a costing bug that it is not — and
        # that a piece really can be built out of an empty satchel and really
        # cannot once the toggle goes back off.
        #
        # It writes the REAL user://settings.json and clears it afterwards; a
        # cheat left switched on there would follow every later step in this job.
        run: godot --headless --path . --script tests/smoke_free_build.gd

      - name: Export Windows build
        # Main (and manual runs) only. The export tail was ~40% of every
        # branch run, and it duplicates work: Release re-exports main itself
        # before publishing, so a broken export can never reach the download
        # link through a branch — it would surface on main's own run, where
        # fixing red main is the loop's standing first priority.
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-debug "Windows Desktop" build/windows/Tetherbound.exe

      - name: Verify the export is a real Windows binary
        # An export can "succeed" and leave a stub behind. Check the file is
        # actually a PE executable and is not implausibly small.
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          file build/windows/Tetherbound.exe
          file build/windows/Tetherbound.exe | grep -q "PE32+ executable"
          SIZE=$(stat -c%s build/windows/Tetherbound.exe)
          echo "exe size: ${SIZE} bytes"
          test "$SIZE" -gt 10000000

      - name: Verify the exported build runs and has ground under the player
        # Exports for Linux and RUNS it. Every other test in this file runs the
        # project from source, where res:// is a real directory and addons load
        # from the project tree — so none of them can see an export-only fault.
        # A build shipped with no terrain in it and all of them were green.
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: |
          sudo apt-get install -y -qq xvfb >/dev/null
          tools/verify_export.sh

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          name: Tetherbound-windows-debug
          path: build/windows/
          retention-days: 14
