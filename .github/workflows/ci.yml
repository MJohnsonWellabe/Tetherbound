        # Walks up to a wild creature, engages, and PILOTS the fight to a win through
        # injected input (docs/decisions/D07). Asserts the things unit tests
        # cannot see: the creature actually moves on the stick, the arena boundary
        # holds it in without ending the fight, a swing at empty air is reported
        # as a miss, a swing at the opponent connects and earns energy, the
        # opponent closes and telegraphs and leaves an opening, and control and
        # camera come back afterwards.
        #
        # The bug this exists for: the deployed creature became a CharacterBody3D and
        # spent every run standing invisibly inside the trainer, so the two
        # bodies shoved each other and launched the player off the playground at
        # 500 m/s. Every unit test still passed.
        #
        # LP9: this scene-boot-and-simulate test is tick-budget-bounded, not
        # wall-clock-bounded — it waits for a fixed number of physics frames
        # (e.g. "the enemy never landed a hit in 15 seconds", "the fight never
        # resolved after 2500 action frames"), which assumes physics ticks
        # advance at something close to real time. Reproduced locally
        # (26 instrumented runs escalating from 6-way to 16-way CPU
        # oversubscription on 4 cores, LP9 in ralph/DONE.md): under heavy
        # contention ticks can take far longer per tick in wall-clock terms
        # than uncontended, which can exhaust a tick budget for real even
        # though the fight logic itself is not stuck — none of those runs
        # showed LP1's terrain-embedding signature (a per-frame position/
        # velocity watchdog covering the whole fight, not just LP1's one
        # teleport, never caught a Y-plunge or an embedded creature). Same
        # mitigation smoke_aggression already uses below for the same reason
        # (RB3/LP7): retry once before failing the job, since a second
        # straight failure is much less likely to be the same transient
        # contention.
