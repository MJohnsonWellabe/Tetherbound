      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          mkdir -p ~/godot-bin
          curl -sSL -o /tmp/godot.zip "${BASE}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp
          mv "/tmp/Godot_v${GODOT_VERSION}_linux.x86_64" ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

          curl -sSL -o /tmp/templates.tpz "${BASE}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp
          TEMPLATE_DIR=~/.local/share/godot/export_templates/${GODOT_VERSION/-/.}
          mkdir -p "$(dirname "$TEMPLATE_DIR")"
          mv /tmp/templates "$TEMPLATE_DIR"

      - name: Add Godot to PATH
        run: echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      - name: Cache the import artifacts
        uses: actions/cache@v4
        with:
          path: .godot
          key: import-${{ env.GODOT_VERSION }}-${{ hashFiles('project.godot', '**/*.import') }}
          restore-keys: import-${{ env.GODOT_VERSION }}-

      - name: Import project (cold)
        run: godot --headless --path . --import || true

      - name: Import project (verify)
        # The authoritative import check, in one pass rather than two — see
        # verify-unit-tests' copy of this step for the full reasoning.
        run: |
          set -euo pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/import.log
          if grep -qiE "SCRIPT ERROR|Parse Error|Failed to load|ERROR: Cannot open" /tmp/import.log; then
            echo "::error::import produced script or resource errors"
            exit 1
          fi

      - name: Smoke-test aggression
        # Two halves, and the second matters more: an aggressive creature must start
        # a fight on its own, and a peaceful one must never do so no matter how
        # long the trainer stands next to it. GAME_DESIGN.md §14 allows the
        # first and forbids the second, and one word in species.json is the only
        # thing between them.
        #
        # RB3 root-caused and fixed this suite's own documented flake (the
        # trainer's own creature walling them in on a direction reversal) — 36
        # consecutive clean runs afterward. The retry below is a safety net for
        # any OTHER non-determinism this scene-boot-and-simulate style of test
        # is prone to, not a substitute for root-causing a new one: a second
        # straight failure still fails the job, and per ralph/PROMPT.md a
        # suspected flake gets reproduced locally and root-caused, not just
        # retried away.
        run: |
          set +e
          godot --headless --path . --script tests/smoke_aggression.gd
          code=$?
          if [ $code -ne 0 ]; then
            echo "::warning::smoke_aggression failed once; retrying once before failing the job"
            godot --headless --path . --script tests/smoke_aggression.gd
            code=$?
          fi
          exit $code

