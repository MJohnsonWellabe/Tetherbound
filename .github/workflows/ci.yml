          set +e
          godot --headless --path . --script tests/smoke_combat.gd
          code=$?
          if [ $code -ne 0 ]; then
            echo "::warning::smoke_combat failed once; retrying once before failing the job"
            godot --headless --path . --script tests/smoke_combat.gd
            code=$?
          fi
          exit $code

