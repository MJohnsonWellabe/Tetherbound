# Deploy Firestore security rules and index definitions.
#
# The rules are version-controlled and deployed by CI, so nobody pastes JSON
# into a console. Only firestore:rules and firestore:indexes are touched, never
# Hosting: the game is served from GitHub Pages and Firebase Hosting stays
# unused even if it was switched on during project setup.
#
# DORMANT until the FIREBASE_SERVICE_ACCOUNT repo secret exists. Until then the
# job no-ops cleanly rather than failing red and cluttering the Actions tab.
name: Deploy Firebase Rules

on:
  push:
    branches:
      - main
      - claude/tetherbound-game-plan-w40lbs
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-firebase.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the service account secret is configured
        id: gate
        env:
          SVC: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SVC" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT is not set. Skipping the rules deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 20

      - name: Write the service-account key
        if: steps.gate.outputs.ready == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          # Fail with a useful message rather than an opaque CLI error if the
          # secret was pasted as a fragment instead of the whole key file.
          node -e "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/sa.json','utf8'))" \
            || { echo '::error::FIREBASE_SERVICE_ACCOUNT is not valid JSON. Paste the ENTIRE downloaded key file, braces included.'; exit 1; }

      # A 403 from firebaserules tells you a permission is missing but never
      # WHICH identity was refused, and the two likely causes look identical
      # from the outside: a role granted to the wrong principal, or a key
      # generated from a different project entirely. Printing the two
      # non-secret fields turns a guessing game into a lookup. The private key
      # is never touched.
      - name: Report which identity is being used
        if: steps.gate.outputs.ready == 'true'
        run: |
          node -e '
            const sa = JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/sa.json", "utf8"));
            const want = JSON.parse(require("fs").readFileSync(".firebaserc", "utf8")).projects.default;
            console.log("service account : " + sa.client_email);
            console.log("key project_id  : " + sa.project_id);
            console.log("target project  : " + want);
            if (sa.project_id !== want) {
              console.log("::error::The key belongs to project \"" + sa.project_id +
                "\" but we are deploying to \"" + want +
                "\". Generate the key from the target project.");
              process.exit(1);
            }
          '

      - name: Deploy Firestore rules and indexes
        if: steps.gate.outputs.ready == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          # pipefail is NOT optional here. Piping the CLI into `tail` makes the
          # pipeline's exit status tail's, which is always 0, so a failed deploy
          # reported as a green job. That happened: a run went fully green while
          # the log contained a 403 from serviceusage.googleapis.com. A deploy
          # that lies about succeeding is worse than one that simply fails.
          set -o pipefail
          # The project is named literally rather than read from .firebaserc.
          # `require('./.firebaserc')` threw on every run so far, because Node's
          # require cannot load a file with no recognised extension. The failure
          # was invisible: the command substitution collapsed to an empty
          # string, `--project ""` fell through to the CLI's own .firebaserc
          # lookup, and the deploy carried on against the right project while
          # printing a stack trace nobody read.
          #
          # Not pinned to firebase-tools@13 any more either. A pin that old was
          # a guess, and auth handling is exactly the area where it could
          # differ from what the current API expects.
          # Rules only, deliberately.
          #
          # Deploying indexes as well needs datastore.indexes.update on top of
          # everything rules needs, and it failed on exactly one call: the
          # field override that exempts `payload` from indexing. That exemption
          # is a write-cost optimisation on a field nothing will ever query,
          # while the rules are what stand between a player's save and everyone
          # else. Letting the optimisation gate the security boundary is the
          # wrong dependency, and each extra API here has meant another IAM
          # round trip.
          #
          # firestore.indexes.json stays in the repo as the source of truth. To
          # apply it, grant the service account Cloud Datastore Index Admin
          # (roles/datastore.indexAdmin) and add firestore:indexes back here.
          npx --yes firebase-tools deploy \
            --only firestore:rules \
            --project tetherbound-5fdd8 \
            --non-interactive \
            --debug 2>&1 | tail -40
