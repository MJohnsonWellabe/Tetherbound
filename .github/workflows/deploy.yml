# Build and deploy the game to GitHub Pages.
#
# A failing typecheck or test blocks the deploy, per ARCHITECTURE.md. That is
# the whole point of running them here rather than trusting a local run.
#
# `main` is the trunk. Everything is built and deployed from it.
#
# READ THIS BEFORE DEBUGGING A FAILED DEPLOY. Listing a branch below is only
# half of the permission. The `github-pages` ENVIRONMENT carries its own
# protection rule naming which branches may deploy, and the two are configured
# in different places. When a branch is in this list but not in the
# environment, the build and test jobs pass, and then the deploy job fails in
# about two seconds having run no steps at all. There is no error message on
# any step, because no step ran. It reads like an infrastructure outage and it
# is a permission check.
#
# To allow a branch: GitHub → Settings → Environments → github-pages →
# "Deployment branches and tags" → add it there, then add it here.
#
# `claude/tetherbound-game-plan-w40lbs` stays listed only because it is
# currently the branch the environment allows. Once `main` is added to the
# environment, that line can go and this file becomes main-only.
name: Deploy

on:
  push:
    branches:
      - main
      - claude/tetherbound-game-plan-w40lbs
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy in flight -- a half-published Pages site is worse than
# a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npx vite build

      # `enablement: true` turns Pages on via the API on the first run instead
      # of failing with "Get Pages site failed" until somebody visits repo
      # Settings and picks GitHub Actions as the source. If the token is not
      # allowed to do that, the manual switch is Settings -> Pages -> Source.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
