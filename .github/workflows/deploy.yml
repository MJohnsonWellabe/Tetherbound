# Build and deploy the game to GitHub Pages.
#
# A failing typecheck or test blocks the deploy, per ARCHITECTURE.md. That is
# the whole point of running them here rather than trusting a local run.
#
# ONE branch deploys, and it is this one.
#
# The `github-pages` environment carries a protection rule naming the branches
# allowed to deploy, and only `claude/tetherbound-game-plan-w40lbs` is on it.
# Pushing from anywhere else -- including `main` -- builds and tests green and
# then fails the deploy job in about two seconds with no steps run, which reads
# like an infrastructure outage rather than a permission check. Do not add a
# branch here without adding it to the environment first, or the failure looks
# like the build broke.
#
# So this branch is the trunk in practice: the M5 integration, which is where
# the two forked M2 implementations were reconciled, is fast-forwarded onto it.
name: Deploy

on:
  push:
    branches:
      - claude/tetherbound-game-plan-w40lbs
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy in flight -- a half-published Pages site is worse than
# a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npx vite build

      # `enablement: true` turns Pages on via the API on the first run instead
      # of failing with "Get Pages site failed" until somebody visits repo
      # Settings and picks GitHub Actions as the source. If the token is not
      # allowed to do that, the manual switch is Settings -> Pages -> Source.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
