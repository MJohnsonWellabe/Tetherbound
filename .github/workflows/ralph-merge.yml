name: Ralph auto-merge

# Ships a Ralph task to main once CI is green, and only then.
#
# The loop's sessions are fired by a Routine and have no GitHub MCP tools and no
# `gh` CLI, so they cannot open a pull request or turn on auto-merge themselves.
# They can only push a branch. This workflow is the other half of that deal: it
# watches CI finish on a `ralph/**` branch and fast-forwards main if — and only
# if — the run succeeded.
#
# The alternative was letting the loop commit straight to main. That is faster
# and it is how classic Ralph works, but a bad iteration then breaks main until
# the next one happens to fix it, and the owner plays whatever main last built.
# A red branch that never merges is a much cheaper failure.
#
# Deliberately NOT a merge commit: main is fast-forwarded, so a task that cannot
# fast-forward (because main moved under it) fails here rather than silently
# resolving a conflict nobody reviewed. The loop rebases and pushes again.
#
# THIS FILE IS THE FAST PATH, NOT THE ONLY PATH. Its trigger has a hole: a run
# that this workflow dispatches itself (the rebase route) completes without
# raising a `workflow_run` event, because GitHub does not raise workflow events
# for runs initiated with the default GITHUB_TOKEN. So a rebased branch goes
# green and nothing here ever wakes up to merge it. `ralph-sweep.yml` is the
# poll-driven backstop that actually lands those; see its header for the
# measurement. The shipping logic itself now lives in tools/ci/ship_branch.sh
# so both callers run the same code.

# Manual consolidation is now the sole path to main.  Keep this workflow
# dispatchable for audit/recovery, but never start it from branch CI.
on:
  workflow_dispatch:

# Merges QUEUE. They must never run at once and must never be cancelled.
#
# Added 2026-08-11 after the loop went from one writer to about ten. With a
# single lane this file never once failed; within two hours of the lanes going
# live, twelve of eighteen runs failed. Most were not real conflicts — several
# merge runs were executing simultaneously and racing each other on
# `git push origin main`, so all but one lost by definition.
#
# `cancel-in-progress: false` is the load-bearing half, and the opposite of
# what ci.yml wants. Cancelling a superseded CI run wastes nothing; cancelling
# a merge abandons work that already passed CI and is sitting on a branch
# waiting to ship.
concurrency:
  group: ralph-merge
  cancel-in-progress: false

permissions:
  contents: write
  # To dispatch Release after shipping, and to dispatch CI after an automatic
  # rebase. See those steps for why a push alone is not enough — it is the same
  # reason both times.
  actions: write

jobs:
  ship:
    runs-on: ubuntu-latest
    # Only green runs, only Ralph's own branches. `head_branch` is the branch
    # CI actually ran on, not the branch this workflow file lives on.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'ralph/')

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a shallow clone cannot fast-forward.
          fetch-depth: 0
          ref: main

      - name: Ship the verified commit
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          # Needed to dispatch CI after an automatic rebase, and Release after a
          # ship. A push made with this token triggers neither on its own.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Passing SHA puts the script in event mode: it verifies the branch tip
        # is still the commit CI went green on before shipping it. Everything
        # else -- the rebase route, the branch delete, the Release dispatch --
        # is in the script, shared with ralph-sweep.yml.
        #
        # Copied out of the repo first, for the reason ralph-sweep.yml spells
        # out: the script checks out other commits in the working tree it runs
        # from, so it can remove itself from disk. A run already in flight
        # survives that (bash holds the open fd -- verified), so this single
        # invocation is not the case that breaks. It is copied anyway so both
        # callers invoke it the same way, and so this file does not quietly
        # depend on being the one that only ever calls it once.
        run: |
          cp tools/ci/ship_branch.sh "$RUNNER_TEMP/ship_branch.sh"
          chmod +x "$RUNNER_TEMP/ship_branch.sh"
          "$RUNNER_TEMP/ship_branch.sh" "$BRANCH" "$SHA"
