name: Ralph sweep

# Lands every `ralph/**` branch that is green and unmerged, on a timer.
#
# `ralph-merge.yml` is the fast path: CI finishes, an event fires, the branch
# ships. This is the path that does not depend on an event arriving.
#
# It exists because the fast path has a hole that only opens on the rebase
# route, which is also its COMMON route under multiple lanes. `ralph-merge.yml`
# rebases a branch that main moved under, force-pushes, and dispatches CI with
# `gh workflow run`. That dispatch works. But GitHub does not raise workflow
# events for runs initiated with the default GITHUB_TOKEN, so when the
# dispatched run finishes, no `workflow_run` event fires and nothing wakes up to
# merge it. The branch sits green, rebased, tested and unmergeable, forever.
#
# Measured on 2026-08-11, across every live branch: each one whose green CI run
# came from a `push` had merged; each one whose green run came from a
# `workflow_dispatch` was stranded. Four at once. That is not a flake, it is the
# rebase path being a dead end by construction.
#
# The same recursion guard had already cost this project twelve hours and
# twenty-five commits of unpublished builds through `release.yml`. Rather than
# patch a third instance later, this workflow stops depending on the delivery of
# events: it reads the world and reconciles it. A missed event costs latency,
# never a lost merge.
#
# `ralph-merge.yml` is deliberately KEPT. Immediate merges on the common green
# path are worth having, and this runs on a timer.

on:
  schedule:
    # Every ten minutes. This is the worst-case latency for a branch whose merge
    # event went missing; the event path still lands the ordinary case in
    # seconds. GitHub treats cron as best-effort and may run it late under load,
    # which is fine -- nothing here is time-critical, it is a backstop.
    - cron: '*/10 * * * *'
  workflow_dispatch:

# Shares ONE queue with ralph-merge.yml, by name.
#
# Both push main. Two of them racing on `git push origin main` is the exact
# failure that took out twelve of eighteen runs when the loop went from one
# writer to about ten. Same group means a sweep can never run beside a merge.
#
# `cancel-in-progress: false` is load-bearing: cancelling a sweep abandons work
# that already passed CI and is sitting on a branch waiting to ship.
concurrency:
  group: ralph-merge
  cancel-in-progress: false

permissions:
  contents: write
  # To dispatch CI after a rebase and Release after a ship. A push made with the
  # default token triggers neither on its own -- that is the whole reason this
  # file exists.
  actions: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a shallow clone cannot fast-forward.
          fetch-depth: 0
          ref: main

      - name: Ship every green, unmerged ralph branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          # Only branches that are still close to main -- measured in COMMITS
          # BEHIND, not in days.
          #
          # A sweep is a RECOVERY mechanism for work that should have merged and
          # didn't, not a licence to resurrect anything that ever passed CI.
          # Rebasing an abandoned branch onto today's main and shipping it
          # because the rebase happened to apply cleanly is how a regression
          # lands that nobody chose.
          #
          # Age in days was tried first and does not work here: this repo can
          # move fifty commits in two days, so every branch alive and dead was
          # inside a 48-hour window. Drift separates them cleanly. Measured the
          # day this was written -- live work sat at 0, 0, 0, 1, 1 and 4 commits
          # behind; abandoned branches sat at 35 and 50. There is no overlap,
          # and 20 is the middle of a very wide gap.
          #
          # Anything beyond the cap is left exactly as it is -- untouched,
          # undeleted, and listed below so it is visible rather than silently
          # ignored. Landing one is a deliberate act by a human or a firing.
          MAX_BEHIND="${MAX_BEHIND:-20}"

          git fetch --quiet origin '+refs/heads/ralph/*:refs/remotes/origin/ralph/*' || true

          FRESH=""
          STALE=""
          while read -r branch; do
            [ -n "$branch" ] || continue
            behind="$(git rev-list --count "origin/$branch..origin/main" 2>/dev/null || echo 9999)"
            if [ "$behind" -le "$MAX_BEHIND" ]; then
              FRESH="$FRESH$branch"$'\n'
            else
              STALE="$STALE  $branch (${behind} commits behind main)"$'\n'
            fi
          done <<< "$(git ls-remote --heads origin 'refs/heads/ralph/*' | sed 's#.*refs/heads/##' | sort)"

          if [ -n "$STALE" ]; then
            echo "Too far behind main to sweep, left alone:"
            printf '%s' "$STALE"
          fi

          if [ -z "$FRESH" ]; then
            echo "No ralph/** branch is close enough to main to sweep."
            exit 0
          fi

          echo "Considering:"
          printf '%s' "$FRESH" | sed 's/^/  /'
          BRANCHES="$FRESH"

          # Run the ship script from OUTSIDE the repository.
          #
          # It checks out other commits in this same working tree -- origin/main
          # to ship from, and the branch itself to rebase. Any commit older than
          # tools/ci/ therefore removes the script from disk, and while the run
          # already in flight survives that (bash holds the open fd), the NEXT
          # iteration of this loop cannot find it to start it.
          #
          # Not hypothetical: it is what the first real sweep did. EV3 hit a
          # genuine conflict -- correctly refused, nothing pushed -- but its
          # rebase left the tree on EV3's tip, which predates tools/ci/. The
          # four branches behind it in the queue were then skipped with
          # "No such file or directory" rather than being considered at all,
          # and the sweep still reported success.
          SHIP="$RUNNER_TEMP/ship_branch.sh"
          cp tools/ci/ship_branch.sh "$SHIP"
          chmod +x "$SHIP"

          # Sequential, and each call re-reads origin/main, because every ship
          # moves main under the branches that have not been considered yet.
          #
          # A branch that needs a human (conflict, or over the rebase cap)
          # returns 1. That must not stop the branches behind it -- the whole
          # point of a sweep is that one stuck branch does not strand the
          # others -- so the failure is recorded and reported at the end.
          STUCK=""
          BROKEN=""
          while read -r branch; do
            [ -n "$branch" ] || continue
            echo "::group::$branch"
            rc=0
            "$SHIP" "$branch" || rc=$?
            echo "::endgroup::"
            case "$rc" in
              0) ;;
              1) STUCK="$STUCK $branch" ;;
              # Anything else is the script failing to RUN, not deciding not to
              # ship -- a missing interpreter, a syntax error, exit 127 for a
              # file that is not there. Those must not read as "considered and
              # declined".
              *) BROKEN="$BROKEN $branch(rc=$rc)" ;;
            esac
          done <<< "$BRANCHES"

          if [ -n "$STUCK" ]; then
            echo "::warning::Needs a human, and was skipped:$STUCK"
          fi

          # A sweep that could not run is not a sweep that found nothing.
          #
          # The first real sweep skipped four branches with "No such file or
          # directory" and still reported success, which is the worst possible
          # outcome for a backstop: it looks like it checked. Silence is not
          # success, so an unexpected exit code fails the job.
          if [ -n "$BROKEN" ]; then
            echo "::error::The ship script failed to run for:$BROKEN"
            exit 1
          fi
