name: Release

# Publishes a downloadable Windows build and the download page.
#
# The CI workflow already exports an .exe, but it uploads a GitHub *artifact* —
# which needs a login to download and expires after 14 days. That is fine for
# checking an export still works and useless as "the link I use to get the
# game". This produces a permanent, no-login URL instead:
#
#   https://github.com/<owner>/<repo>/releases/download/latest/Tetherbound-windows.zip
#
# That URL is stable forever and always points at the newest build, which is
# what the download button on the site links to. Nothing has to be edited when
# a new build ships.
#
# Addressed by TAG, not by "latest release". The near-identical
# `/releases/latest/download/<file>` form resolves through GitHub's idea of the
# latest release, which excludes prereleases — and this release is a prerelease
# (see below), and is the only one, so that form 404s. It did for every build
# up to and including the one that added the produced character art: the asset
# was uploaded and current, and the download button was dead. The tag here is
# literally `latest` and is re-pointed on every push, so the by-tag form is
# just as permanent and ignores the prerelease flag.
#
# Release, not debug. The CI export is `--export-debug` because a debug build
# reports errors usefully in a test harness. What the owner plays on the Ally
# should be the real thing.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed to create releases and to publish the Pages site.
permissions:
  contents: write
  pages: write
  id-token: write

env:
  GODOT_VERSION: 4.7-stable

concurrency:
  # A newer push supersedes an older one; there is only ever one "latest".
  group: release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot editor and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          mkdir -p ~/godot-bin
          curl -sSL -o /tmp/godot.zip "${BASE}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp
          mv "/tmp/Godot_v${GODOT_VERSION}_linux.x86_64" ~/godot-bin/godot
          chmod +x ~/godot-bin/godot
          curl -sSL -o /tmp/templates.tpz "${BASE}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp
          TEMPLATE_DIR=~/.local/share/godot/export_templates/${GODOT_VERSION/-/.}
          mkdir -p "$(dirname "$TEMPLATE_DIR")"
          mv /tmp/templates "$TEMPLATE_DIR"

      - name: Add Godot to PATH
        run: echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      - name: Import project
        # The first import on a clean checkout exits non-zero while Terrain3D's
        # GDExtension registers its classes; the second pass is authoritative.
        # Same reasoning as ci.yml, which explains it at length.
        run: |
          godot --headless --path . --import || true
          godot --headless --path . --import

      - name: Export Windows release build
        run: |
          set -euo pipefail
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" build/windows/Tetherbound.exe

      - name: Verify the export is a real Windows binary
        # An export can "succeed" and leave a stub behind, and a download page
        # serving a 2 KB stub is worse than one serving nothing.
        run: |
          set -euo pipefail
          file build/windows/Tetherbound.exe | grep -q "PE32+ executable"
          test "$(stat -c%s build/windows/Tetherbound.exe)" -gt 10000000
          ls -la build/windows/

      - name: Verify the exported build actually runs
        # The check that matters, and the one that did not exist when a build
        # shipped that fell through the world forever. It exports, runs the
        # EXPORTED BINARY, and asserts there is terrain under the player.
        #
        # Everything else here checks the file. This checks the game.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb >/dev/null
          tools/verify_export.sh

      - name: Stage GDExtension libraries for shipping
        # Godot writes them flat next to the executable; the engine looks for
        # them at their res:// path relative to it. Ship both.
        run: tools/stage_gdextension_libs.sh build/windows

      - name: Package
        # Zipped because a Godot export is an .exe next to a .pck and a
        # Terrain3D .dll, and all three have to travel together. Downloading a
        # bare .exe and finding it will not start is the obvious failure here.
        run: |
          set -euo pipefail
          cd build/windows
          zip -r ../../Tetherbound-windows.zip .
          cd ../..
          unzip -l Tetherbound-windows.zip

      - name: Publish the rolling latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Tetherbound — latest build
          body: |
            Automatic build of `main`, commit ${{ github.sha }}.

            **Windows / ROG Ally.** Unzip and run `Tetherbound.exe` — keep the
            `.pck` and the `.dll` next to it.

            This is a vertical-slice prototype in progress, not a finished game.

            The three starters, the trainer, Grandpa, the Warden and the
            Veridian Stag are produced from the project's own concept art.
            The rest of the wild roster is still stand-ins.
          files: Tetherbound-windows.zip
          # Truthfully a prerelease: this is a slice, not a game. Keeping the
          # flag honest is why the download link is addressed by tag — see the
          # note at the top of this file.
          prerelease: true
          # No effect while `prerelease: true`; GitHub will not mark a
          # prerelease as the latest release. Left in place so that clearing
          # the prerelease flag one day does the right thing on its own.
          make_latest: true

  pages:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
