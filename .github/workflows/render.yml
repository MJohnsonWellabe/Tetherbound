# On-demand render/smoke offload (WORKFLOW §8). A lane dispatches this from
# `main` with `checkout_ref` set to its own branch or SHA, keeps working, and
# reads the uploaded artifact when the run finishes. GitHub runners have no
# GPU either, so one render is not faster than in a lane container; the gain
# is that the lane's own machine stays free and several runs go in parallel.
#
# Inputs are validated against strict patterns before any shell use, and are
# only passed through env vars, never interpolated into a script.
#
# Output: every file the run created or changed in the working tree (shots/,
# ralph/reports/, ...), the run's user:// directory and run.log, uploaded as
# artifact `render-<label>-<run_id>`.
# Functional offloads select Dummy audio explicitly: hosted runners have no
# audio device. These artifacts cannot establish audible playback acceptance.
name: render
run-name: render ${{ inputs.label }} @ ${{ inputs.checkout_ref }}

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: Branch or SHA to check out and run.
        required: true
      script:
        description: Script to run, e.g. tools/capture_cloudreach_frame_matrix.gd (tests/ or tools/ only).
        required: true
      args:
        description: User args passed after `--` (letters, digits, and _=,./:@+- and spaces).
        required: false
        default: ""
      mode:
        description: render (xvfb + selected native renderer) or headless.
        type: choice
        options: [render, headless]
        default: render
      resolution:
        description: Window size for render mode.
        required: false
        default: 1280x720
      rendering_method:
        description: Native renderer for render mode; headless mode is unchanged.
        type: choice
        options: [gl_compatibility, forward_plus]
        default: gl_compatibility
      timeout_minutes:
        description: Wall-clock cap for the script, in minutes (max 150).
        required: false
        default: "60"
      label:
        description: Short name used in the artifact name.
        required: false
        default: run
      source_run_id:
        description: Optional prior run in this repository; supply source_artifact_name too.
        required: false
        default: ""
      source_artifact_name:
        description: Exact prior artifact to extract into .tmp/producer-source before running.
        required: false
        default: ""

permissions:
  contents: read
  actions: read

env:
  GODOT_VERSION: 4.7-stable

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - name: Validate inputs
        env:
          CHECKOUT_REF: ${{ inputs.checkout_ref }}
          SCRIPT: ${{ inputs.script }}
          ARGS: ${{ inputs.args }}
          RES: ${{ inputs.resolution }}
          TMIN: ${{ inputs.timeout_minutes }}
          LABEL: ${{ inputs.label }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_ARTIFACT_NAME: ${{ inputs.source_artifact_name }}
          RENDERING_METHOD: ${{ inputs.rendering_method }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [[ "$CHECKOUT_REF" =~ ^[A-Za-z0-9._/-]{1,200}$ ]] || fail "checkout_ref has disallowed characters"
          [[ "$CHECKOUT_REF" != *..* ]] || fail "checkout_ref may not contain .."
          [[ "$CHECKOUT_REF" != -* ]] || fail "checkout_ref may not start with -"
          [[ "$SCRIPT" =~ ^(tests|tools)/[A-Za-z0-9_/.-]+\.gd$ ]] || fail "script must be tests/*.gd or tools/*.gd"
          [[ "$SCRIPT" != *..* ]] || fail "script may not contain .."
          [[ "$ARGS" =~ ^[A-Za-z0-9_=,./:@+\ -]*$ ]] || fail "args has disallowed characters"
          [[ "$RES" =~ ^[0-9]{3,4}x[0-9]{3,4}$ ]] || fail "resolution must look like 1280x720"
          [[ "$TMIN" =~ ^[0-9]{1,3}$ ]] && (( TMIN >= 1 && TMIN <= 150 )) || fail "timeout_minutes must be 1-150"
          [[ "$LABEL" =~ ^[A-Za-z0-9_.-]{1,60}$ ]] || fail "label must be 1-60 of [A-Za-z0-9_.-]"
          if [[ -n "$SOURCE_RUN_ID" || -n "$SOURCE_ARTIFACT_NAME" ]]; then
            [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]] || fail "source_run_id must be a positive decimal run ID; supply both source inputs"
            [[ "$SOURCE_ARTIFACT_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,199}$ ]] || fail "source_artifact_name must be 1-200 of [A-Za-z0-9_.-], beginning with a letter or digit; supply both source inputs"
          fi
          [[ "$RENDERING_METHOD" = gl_compatibility || "$RENDERING_METHOD" = forward_plus ]] || fail "unknown rendering method"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref }}
          # Same partial checkout as ci.yml's verification jobs: no blobs from
          # the capture-output and archive trees. Scripts that write into
          # ralph/reports or shots/ create the directories they need.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/ralph/
            !/docs/
            !/shots/
            !/assets_raw/
            !/archive/

      - name: Check the script exists on that ref
        env:
          SCRIPT: ${{ inputs.script }}
          CHECKOUT_REF: ${{ inputs.checkout_ref }}
        run: test -f "$SCRIPT" || { echo "::error::$SCRIPT not found on $CHECKOUT_REF"; exit 1; }

      - name: Download original producer artifact
        if: inputs.source_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.source_artifact_name }}
          path: .tmp/producer-source
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}

      - uses: ./.github/actions/setup-godot

      - name: Install xvfb
        if: inputs.mode == 'render'
        env:
          RENDERING_METHOD: ${{ inputs.rendering_method }}
        run: |
          packages=(xvfb)
          if [ "$RENDERING_METHOD" = forward_plus ]; then packages+=(mesa-vulkan-drivers libvulkan1); fi
          sudo apt-get install -y -qq "${packages[@]}" >/dev/null

      - name: Run
        env:
          SCRIPT: ${{ inputs.script }}
          ARGS: ${{ inputs.args }}
          RES: ${{ inputs.resolution }}
          TMIN: ${{ inputs.timeout_minutes }}
          MODE: ${{ inputs.mode }}
          RENDERING_METHOD: ${{ inputs.rendering_method }}
        run: |
          set -uo pipefail
          export XDG_DATA_HOME="$RUNNER_TEMP/userdata"
          mkdir -p "$XDG_DATA_HOME" "$RUNNER_TEMP/out"
          read -r -a user_args <<< "$ARGS"
          extra=()
          [ ${#user_args[@]} -gt 0 ] && extra=(-- "${user_args[@]}")
          touch "$RUNNER_TEMP/start_marker"
          t0=$SECONDS
          if [ "$MODE" = render ]; then
            driver=opengl3
            if [ "$RENDERING_METHOD" = forward_plus ]; then driver=vulkan; fi
            timeout "$((TMIN * 60))" xvfb-run -a -s "-screen 0 ${RES}x24" \
              godot --path . --rendering-method "$RENDERING_METHOD" --rendering-driver "$driver" --audio-driver Dummy --resolution "$RES" \
              --script "$SCRIPT" "${extra[@]}" > "$RUNNER_TEMP/out/run.log" 2>&1
          else
            timeout "$((TMIN * 60))" godot --headless --path . \
              --script "$SCRIPT" "${extra[@]}" > "$RUNNER_TEMP/out/run.log" 2>&1
          fi
          rc=$?
          echo "exit=$rc took=$((SECONDS - t0))s" | tee -a "$RUNNER_TEMP/out/run.log"
          tail -60 "$RUNNER_TEMP/out/run.log"
          echo "$rc" > "$RUNNER_TEMP/out/exit_code"

      - name: Collect outputs
        if: always()
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/out"
          mkdir -p "$out/tree" "$out/user"
          # Every file the run created or modified in the working tree,
          # ignored paths (shots/ etc.) included, by mtime against a marker
          # touched just before the run. NUL-separated, so any path is safe.
          if [ -f "$RUNNER_TEMP/start_marker" ]; then
            find . \( -path ./.git -o -path ./.godot \) -prune -o \
              -type f -newer "$RUNNER_TEMP/start_marker" -print0 \
              | xargs -0 -r cp --parents -t "$out/tree/"
          fi
          # Bare native net smokes use /tmp/net-run-<unique invocation>.
          # Retain this run's peer logs/saves without changing their runtime paths.
          if [ -f "$RUNNER_TEMP/start_marker" ]; then
            mkdir -p "$out/net-runs"
            find /tmp -maxdepth 1 -type d -name 'net-run-*' -newer "$RUNNER_TEMP/start_marker" \
              -exec cp -a -- {} "$out/net-runs/" \;
          fi
          # user:// minus Godot's shader cache (tens of MB nobody reads).
          (cd "$RUNNER_TEMP/userdata" 2>/dev/null && find . -path '*/shader_cache' -prune -o -type f -print0 \
            | xargs -0 -r cp --parents -t "$out/user/") || true
          # A log-spamming script can write gigabytes (a capture tool once wrote
          # ~12 GB of run.log and godot.log). Keep the first 5 MB and last 20 MB
          # of any log over 25 MB so the artifact stays downloadable.
          find "$out" -type f -name '*.log' -size +25M -print0 | while IFS= read -r -d '' f; do
            { head -c 5000000 "$f"; printf '\n\n[... truncated by render.yml: %s bytes total ...]\n\n' "$(stat -c%s "$f")"; tail -c 20000000 "$f"; } > "$f.cut" && mv "$f.cut" "$f"
          done
          find "$out" -type f | sed "s|$out/||" | sort > "$out/MANIFEST.txt"
          echo "files=$(wc -l < "$out/MANIFEST.txt")"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-${{ inputs.label }}-${{ github.run_id }}
          path: ${{ runner.temp }}/out/
          retention-days: 7

      - name: Fail if the script failed
        run: |
          rc=$(cat "$RUNNER_TEMP/out/exit_code" 2>/dev/null || echo 1)
          [ "$rc" = 0 ] || { echo "::error::script exited $rc (124 = timeout)"; exit 1; }
