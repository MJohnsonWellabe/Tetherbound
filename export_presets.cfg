; Linux, and it is a TEST TARGET, not a shipping one.
;
; Windows is the platform (CLAUDE.md), and nothing here changes that. This
; exists because CI runs on Linux and the only way to find out whether an
; exported build actually WORKS is to run one — which CI could not do while the
; only preset targeted a platform the runner cannot execute.
;
; It was added after a shipped Windows build fell through the world forever.
; The Terrain3D GDExtension failed to load in the export, so there was no
; terrain at all and the player fell from the spawn height with nothing beneath
; them. Every test passed: 107 unit tests, seven smokes, and an export check
; that confirmed the .exe was a real PE binary over 10MB. None of them ran the
; thing that was broken.
[preset.1]

name="Linux Test"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/scatter/*.bin"
exclude_filter="docs/*, *.md"
export_path="build/linux/Tetherbound.x86_64"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false
